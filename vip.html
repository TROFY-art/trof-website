<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIP | TROF System</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="dust" aria-hidden="true"></div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
    <div id="server-selector"></div>
    <div id="acct"></div>
  </div>
</header>

<main class="wrap page" id="page"></main>
<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
(function(){
var CHEV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
TROF.dust();

var currentGuildId = null;
var vipStatus = null;

TROF.load(function(){
  TROF.mountAccount();
  TROF.renderServerSelector();
  var page=document.getElementById('page');
  var u=TROF.auth.user;

  if(!u){
    page.innerHTML='<a class="back" href="./">'+CHEV+'الرجوع</a><p class="soon">سجّل الدخول للوصول.</p>';
    return;
  }

  currentGuildId = TROF.getSelectedGuild();
  if(!currentGuildId){
    page.innerHTML='<a class="back" href="./">'+CHEV+'الرجوع</a><p class="soon">⚠️ اختر سيرفراً أولاً.</p>';
    return;
  }

  page.innerHTML = buildVIPPage();
  loadVIPStatus();
  bindEvents();
});

function buildVIPPage(){
  return '' +
  '<a class="back" href="./">'+CHEV+'الرجوع</a>' +
  '<div class="sec-head"><div class="sec-ic"><span class="ring"></span><span class="face">💎</span></div><div><h1 class="sec-title">VIP</h1><p>فعّل حساب VIP في سيرفرك</p></div></div>' +

  '<div class="vip-container">' +
    // حالة VIP
    '<div class="vip-status-card" id="vip-status-card">' +
      '<div class="vip-status-icon">💎</div>' +
      '<div class="vip-status-info">' +
        '<b>جاري التحقق...</b>' +
        '<small>من فضلك انتظر</small>' +
      '</div>' +
    '</div>' +

    // حقل الكود
    '<div class="vip-redeem-card">' +
      '<div class="form-section-title">🔑 تفعيل كود VIP</div>' +
      '<div class="form-row form-row-col">' +
        '<label class="form-label">أدخل الكود</label>' +
        '<input type="text" class="form-select" id="vip-code" placeholder="TROF-XXXX-XXXX-XXXX" style="text-transform:uppercase;direction:ltr;text-align:center;font-size:1.1rem;letter-spacing:2px;font-weight:800;">' +
        '<p class="form-hint">احصل على الكود من مالك البوت</p>' +
      '</div>' +
      '<div class="form-actions">' +
        '<button class="btn save-btn" id="redeem-btn" type="button">✨ تفعيل VIP</button>' +
        '<p class="save-msg" id="redeem-msg"></p>' +
      '</div>' +
    '</div>' +

    // الميزات
    '<div class="vip-features-card">' +
      '<div class="form-section-title">✨ ميزات VIP</div>' +
      '<ul class="vip-features">' +
        '<li><span>🎨</span><div><b>تخصيص صورة البوت</b><small>تغيير صورة البوت في سيرفرك</small></div></li>' +
        '<li><span>📝</span><div><b>تخصيص اسم البوت</b><small>تغيير اسم البوت في سيرفرك</small></div></li>' +
        '<li><span>🎭</span><div><b>تخصيص الرتب والقنوات</b><small>تحكم كامل</small></div></li>' +
        '<li><span>⚡</span><div><b>أولوية في الدعم</b><small>مساعدة أسرع</small></div></li>' +
        '<li><span>🚀</span><div><b>ميزات حصرية</b><small>تحديثات مبكرة</small></div></li>' +
      '</ul>' +
    '</div>' +
  '</div>';
}

async function loadVIPStatus(){
  var card = document.getElementById('vip-status-card');
  
  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/vip/status?guild_id=' + currentGuildId, {
      headers: {Authorization: 'Bearer ' + TROF.token()}
    });

    if(res.ok){
      var data = await res.json();
      vipStatus = data;

      if(data.is_vip){
        card.className = 'vip-status-card active';
        card.innerHTML = 
          '<div class="vip-status-icon">💎</div>' +
          '<div class="vip-status-info">' +
            '<b>✅ أنت VIP نشط!</b>' +
            '<small>ينتهي: ' + (data.expires_at || '—') + '</small>' +
          '</div>';
      }else{
        card.className = 'vip-status-card inactive';
        card.innerHTML = 
          '<div class="vip-status-icon">❌</div>' +
          '<div class="vip-status-info">' +
            '<b>لست VIP</b>' +
            '<small>أدخل كوداً لتفعيل VIP</small>' +
          '</div>';
      }
    }
  }catch(e){
    card.innerHTML = 
      '<div class="vip-status-icon">⚠️</div>' +
      '<div class="vip-status-info">' +
        '<b>خطأ في التحميل</b>' +
        '<small>حاول مرة أخرى</small>' +
      '</div>';
  }
}

async function redeemCode(){
  var code = document.getElementById('vip-code').value.trim().toUpperCase();
  var msg = document.getElementById('redeem-msg');
  var btn = document.getElementById('redeem-btn');

  if(!code){
    msg.textContent = '❌ أدخل الكود';
    msg.style.color = '#f87171';
    return;
  }

  btn.disabled = true;
  msg.textContent = '⏳ جاري التفعيل...';
  msg.style.color = '#f2c23c';

  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/vip/redeem', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + TROF.token(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({code: code, guild_id: parseInt(currentGuildId)})
    });

    var data = await res.json();

    if(res.ok){
      msg.textContent = '✅ ' + data.message;
      msg.style.color = '#4ade80';
      document.getElementById('vip-code').value = '';
      setTimeout(loadVIPStatus, 1000);
    }else{
      msg.textContent = '❌ ' + (data.detail || 'فشل');
      msg.style.color = '#f87171';
    }
  }catch(e){
    msg.textContent = '❌ خطأ في الاتصال';
    msg.style.color = '#f87171';
  }

  btn.disabled = false;
}

function bindEvents(){
  var btn = document.getElementById('redeem-btn');
  if(btn) btn.onclick = redeemCode;

  var input = document.getElementById('vip-code');
  if(input){
    input.addEventListener('keypress', function(e){
      if(e.key === 'Enter') redeemCode();
    });
  }
}
})();
</script>
</body>
</html>
