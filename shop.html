<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتجر | TROF System</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* ===== Modal ===== */
  .trof-modal {
    position: fixed; inset: 0; z-index: 99999;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.85); backdrop-filter: blur(8px);
    padding: 20px;
  }
  .trof-modal.show { display: flex !important; }
  .trof-modal-box {
    background: #171410; border: 2px solid #2f2818;
    border-radius: 20px; padding: 28px 24px;
    max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 30px 80px -20px #000;
  }
  .trof-modal-icon { font-size: 3rem; margin-bottom: 12px; }
  .trof-modal-title {
    font-size: 1.3rem; font-weight: 800;
    color: #f6efdc; margin: 0 0 10px;
  }
  .trof-modal-text {
    color: #a89f88; font-size: .95rem;
    margin: 0 0 20px; line-height: 1.6;
  }
  .trof-modal-text b { color: #F2C23C; }
  .trof-modal-btns {
    display: flex; gap: 10px; justify-content: center;
  }
  .trof-modal-btn {
    flex: 1; padding: 12px 20px; border-radius: 12px;
    font-weight: 800; font-size: .95rem;
    cursor: pointer; border: none;
    font-family: inherit;
  }
  .trof-modal-btn.confirm, .trof-modal-btn.ok {
    background: linear-gradient(180deg, #A8F0C0, #2ECC71);
    color: #0a2818;
  }
  .trof-modal-btn.cancel {
    background: #2a2419; color: #f6efdc;
    border: 1px solid #2f2818;
  }
</style>
</head>
<body>
<div id="dust" aria-hidden="true"></div>

<!-- Modal -->
<div class="trof-modal" id="trof-modal">
  <div class="trof-modal-box">
    <div class="trof-modal-icon" id="trof-modal-icon">❓</div>
    <h3 class="trof-modal-title" id="trof-modal-title">تأكيد</h3>
    <p class="trof-modal-text" id="trof-modal-text"></p>
    <div class="trof-modal-btns" id="trof-modal-btns"></div>
  </div>
</div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
  <div id="acct"></div>
  <div id="server-selector"></div>
  </div>
</header>

<main class="wrap page" id="page"></main>
<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
(function(){
var CHEV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
TROF.dust();

console.log('🚀 shop.js بدأ التحميل');

// ============================================
// 🪟 Modal Helpers
// ============================================
function showAlert(icon, title, text) {
  return new Promise(function(resolve){
    console.log('🪟 showAlert:', title);
    var modal = document.getElementById('trof-modal');
    if (!modal) {
      console.error('❌ trof-modal غير موجود!');
      alert(icon + ' ' + title + '\n' + text.replace(/<[^>]+>/g, ''));
      resolve();
      return;
    }
    document.getElementById('trof-modal-icon').textContent = icon;
    document.getElementById('trof-modal-title').textContent = title;
    document.getElementById('trof-modal-text').innerHTML = text;
    var btns = document.getElementById('trof-modal-btns');
    btns.innerHTML = '<button class="trof-modal-btn ok">موافق</button>';
    btns.querySelector('.ok').onclick = function(){
      modal.classList.remove('show');
      resolve();
    };
    modal.classList.add('show');
    console.log('✅ showAlert تم');
  });
}

function showConfirm(icon, title, text) {
  return new Promise(function(resolve){
    console.log('🪟 showConfirm:', title);
    var modal = document.getElementById('trof-modal');
    if (!modal) {
      console.error('❌ trof-modal غير موجود!');
      var result = confirm(title + '\n' + text.replace(/<[^>]+>/g, ''));
      resolve(result);
      return;
    }
    document.getElementById('trof-modal-icon').textContent = icon;
    document.getElementById('trof-modal-title').textContent = title;
    document.getElementById('trof-modal-text').innerHTML = text;
    var btns = document.getElementById('trof-modal-btns');
    btns.innerHTML =
      '<button class="trof-modal-btn cancel">إلغاء</button>' +
      '<button class="trof-modal-btn confirm">تأكيد</button>';
    btns.querySelector('.confirm').onclick = function(){
      modal.classList.remove('show');
      resolve(true);
    };
    btns.querySelector('.cancel').onclick = function(){
      modal.classList.remove('show');
      resolve(false);
    };
    modal.classList.add('show');
    console.log('✅ showConfirm تم');
  });
}

var currentTab = 'games';
var userItems = [];
var shopItems = [];
var userBalance = 0;

TROF.load(function(){
  console.log('📥 TROF.load انتهى');
  TROF.mountAccount();
  TROF.renderServerSelector();
  var page=document.getElementById('page');
  var u=TROF.auth.user;

  console.log('👤 User:', u ? u.username : 'غير مسجل');

  if(!u){
    page.innerHTML='<a class="back" href="./">'+CHEV+'الرجوع</a><p class="soon">سجّل الدخول للوصول للمتجر.</p>';
    return;
  }

  page.innerHTML = buildShopPage();
  loadAll();
  bindEvents();
});

function buildShopPage(){
  return '' +
  '<a class="back" href="./">'+CHEV+'الرجوع</a>' +
  '<div class="sec-head"><div class="sec-ic"><span class="ring"></span><span class="face">🏪</span></div><div><h1 class="sec-title">المتجر</h1><p>اشترِ خلفيات وأغراض مميزة</p></div></div>' +
  '<div class="balance-card">' +
    '<div class="balance-icon">💰</div>' +
    '<div class="balance-info">' +
      '<span>رصيدك</span>' +
      '<b id="my-balance">—</b>' +
    '</div>' +
  '</div>' +
  '<div class="shop-tabs">' +
    '<button class="shop-tab active" data-tab="games">🎮 ألعاب</button>' +
    '<button class="shop-tab" data-tab="anime">🌸 أنمي</button>' +
    '<button class="shop-tab" data-tab="nature">🌄 طبيعة</button>' +
    '<button class="shop-tab" data-tab="sports">⚽ رياضة</button>' +
    '<button class="shop-tab" data-tab="space">🌌 فضاء</button>' +
    '<button class="shop-tab" data-tab="premium">💎 مميزة</button>' +
    '<button class="shop-tab" data-tab="owner">👑 المالك</button>' +
    '<button class="shop-tab" data-tab="profile_size">📐 أحجام</button>' +
  '</div>' +
  '<div class="shop-content" id="shop-content">' +
    '<p class="form-hint">جاري التحميل...</p>' +
  '</div>';
}

async function loadAll(){
  console.log('📦 loadAll بدأ');
  var u = TROF.auth.user;

  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/users/' + u.id, {
      headers: {Authorization: 'Bearer ' + TROF.token()}
    });
    console.log('📦 /users status:', res.status);
    if(res.ok){
      var data = await res.json();
      userBalance = data.balance || 0;
      document.getElementById('my-balance').textContent = TROF.formatNumber(userBalance) + ' 💰';
      console.log('💰 balance:', userBalance);
    }
  }catch(e){ console.error('❌ users fetch:', e.message); }

  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/shop/my-items?user_id=' + u.id, {
      headers: {Authorization: 'Bearer ' + TROF.token()}
    });
    console.log('📦 /my-items status:', res.status);
    if(res.ok){
      var data = await res.json();
      userItems = data.items || [];
      console.log('🎒 my-items:', userItems.length);
    }
  }catch(e){ console.error('❌ my-items fetch:', e.message); }

  await loadShopItems();
}

async function loadShopItems(){
  console.log('🛒 loadShopItems:', currentTab);
  var content = document.getElementById('shop-content');
  content.innerHTML = '<p class="form-hint">جاري التحميل...</p>';

  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/shop/items?category=' + currentTab, {
      headers: {Authorization: 'Bearer ' + TROF.token()}
    });
    console.log('🛒 /shop/items status:', res.status);

    if(res.ok){
      var data = await res.json();
      shopItems = data.items || [];
      console.log('🛒 items:', shopItems.length);

      if(shopItems.length === 0){
        content.innerHTML = '<p class="form-hint">لا توجد منتجات في هذا القسم بعد</p>';
        return;
      }

      var html = '<div class="shop-grid">';
      shopItems.forEach(function(item){
        var owned = userItems.some(function(ui){ return ui.id === item.id });
        var equipped = userItems.some(function(ui){ return ui.id === item.id && ui.equipped });
        var rarityClass = 'rarity-' + item.rarity;

        var imgStyle = '';
        var imgClass = 'shop-item-img';
        var emoji = '';

        if(currentTab === 'profile_size'){
          var sizeColor = '#888888';
          if(item.image_url && item.image_url.indexOf(':') > -1){
            var parts = item.image_url.split(':');
            if(parts.length >= 3) sizeColor = parts[2];
          }
          imgStyle = 'background: linear-gradient(135deg, ' + sizeColor + ' 0%, #1a1a1a 100%);';
          emoji = '📐';
        }else if(item.image_url && item.image_url.trim() && !item.image_url.includes('imgur')){
          imgStyle = 'background-image: url(\'' + item.image_url + '\');';
        }else{
          imgClass += ' fallback';
          emoji = '🎨';
        }

        html += '<div class="shop-item ' + rarityClass + '">';
        html += '<div class="' + imgClass + '" style="' + imgStyle + '">';
        if(emoji) html += emoji;
        if(owned && equipped) html += '<span class="item-badge">✓ مجهز</span>';
        html += '</div>';

        html += '<div class="shop-item-footer">';
        html += '<span class="item-price">' + TROF.formatNumber(item.price) + ' 💰</span>';

        if(owned){
          if(equipped){
            html += '<button class="item-btn equipped" disabled>✓ مجهز</button>';
          }else{
            html += '<button class="item-btn equip-btn" data-id="' + item.id + '">✨ تجهيز</button>';
          }
        }else{
          html += '<button class="item-btn buy-btn" data-id="' + item.id + '" data-price="' + item.price + '">🛒 شراء</button>';
        }

        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
      content.innerHTML = html;

      content.querySelectorAll('.buy-btn').forEach(function(btn){
        btn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          buyItem(btn);
        };
      });
      content.querySelectorAll('.equip-btn').forEach(function(btn){
        btn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          equipItem(btn);
        };
      });

      console.log('✅ تم ربط', content.querySelectorAll('.buy-btn').length, 'زر شراء');
    }else{
      content.innerHTML = '<p class="form-hint">خطأ ' + res.status + '</p>';
    }
  }catch(e){
    console.error('❌ shop/items fetch:', e.message);
    content.innerHTML = '<p class="form-hint">خطأ في الاتصال: ' + e.message + '</p>';
  }
}

async function buyItem(btn){
  console.log('🛒 ===== buyItem بدأ =====');

  var itemId = parseInt(btn.getAttribute('data-id'));
  var price = parseInt(btn.getAttribute('data-price'));

  console.log('  itemId:', itemId);
  console.log('  price:', price);

  var item = shopItems.find(function(i){ return i.id === itemId });
  console.log('  item:', item);
  console.log('  shopItems.length:', shopItems.length);
  console.log('  userBalance:', userBalance);
  console.log('  typeof showConfirm:', typeof showConfirm);
  console.log('  typeof showAlert:', typeof showAlert);

  if(!item) {
    console.error('❌ item غير موجود في shopItems');
    await showAlert('❌', 'خطأ', 'المنتج غير موجود في القائمة. حدّث الصفحة.');
    return;
  }

  if(userBalance < price){
    console.log('⚠️ رصيد غير كافٍ');
    await showAlert('❌', 'رصيد غير كافٍ',
      'تحتاج <b>' + TROF.formatNumber(price - userBalance) + ' 💰</b> إضافية.<br>' +
      'رصيدك: <b>' + TROF.formatNumber(userBalance) + ' 💰</b>');
    return;
  }

  console.log('  ✅ الفحوصات نجحت، عرض Modal');
  var ok = await showConfirm('🛒', 'تأكيد الشراء',
    'هل تريد شراء <b>' + item.name + '</b> بسعر <b>' + TROF.formatNumber(price) + ' 💰</b>؟');

  console.log('  نتيجة Confirm:', ok);

  if(!ok) return;

  btn.disabled = true;
  btn.textContent = '⏳...';

  try{
    console.log('  📤 POST /shop/buy/' + itemId);
    var res = await fetch(TROF.CONFIG.apiUrl + '/shop/buy/' + itemId, {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + TROF.token(), 'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: TROF.auth.user.id})
    });

    console.log('  📥 Status:', res.status);
    var text = await res.text();
    console.log('  📥 Response:', text.slice(0, 200));

    var data = {};
    try { data = JSON.parse(text); } catch(e) { data = { detail: text }; }

    if(res.ok){
      await showAlert('✅', 'تم الشراء!', data.message || 'تم شراء المنتج');
      userBalance = data.new_balance || (userBalance - price);
      document.getElementById('my-balance').textContent = TROF.formatNumber(userBalance) + ' 💰';
      await loadAll();
    }else{
      await showAlert('❌', 'فشل الشراء', data.detail || ('خطأ ' + res.status));
      btn.disabled = false;
      btn.textContent = '🛒 شراء';
    }
  }catch(e){
    console.error('  ❌ خطأ:', e.message);
    await showAlert('⚠️', 'خطأ في الاتصال', e.message);
    btn.disabled = false;
    btn.textContent = '🛒 شراء';
  }
}

async function equipItem(btn){
  console.log('✨ equipItem:', btn.getAttribute('data-id'));
  var itemId = parseInt(btn.getAttribute('data-id'));

  btn.disabled = true;
  btn.textContent = '⏳...';

  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/shop/equip/' + itemId, {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + TROF.token(), 'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: TROF.auth.user.id})
    });

    var text = await res.text();
    var data = {};
    try { data = JSON.parse(text); } catch(e) { data = { detail: text }; }

    if(res.ok){
      await showAlert('✅', 'تم التجهيز!', data.message || 'تم تجهيز المنتج');
      await loadAll();
    }else{
      await showAlert('❌', 'فشل التجهيز', data.detail || ('خطأ ' + res.status));
      btn.disabled = false;
      btn.textContent = '✨ تجهيز';
    }
  }catch(e){
    await showAlert('⚠️', 'خطأ في الاتصال', e.message);
    btn.disabled = false;
    btn.textContent = '✨ تجهيز';
  }
}

function bindEvents(){
  document.querySelectorAll('.shop-tab').forEach(function(tab){
    tab.onclick = function(){
      document.querySelectorAll('.shop-tab').forEach(function(t){ t.classList.remove('active') });
      tab.classList.add('active');
      currentTab = tab.getAttribute('data-tab');
      loadShopItems();
    };
  });
}

console.log('✅ shop.js جاهز');
})();
</script>
</body>
</html>
