<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شروط الخدمة | TROF System</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .legal-page { max-width: 800px; margin: 0 auto; padding: 20px 0 60px; }
  .legal-page h1 { font-size: 2rem; margin-bottom: 8px; }
  .legal-page .last-update { color: var(--muted); font-size: .9rem; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .legal-page h2 { font-size: 1.3rem; color: var(--gold-hi); margin-top: 32px; margin-bottom: 12px; }
  .legal-page p, .legal-page li { line-height: 2; color: var(--text); }
  .legal-page ul { padding-inline-start: 24px; }
  .legal-page li { margin-bottom: 8px; }
  .legal-page strong { color: var(--gold-hi); }
  .legal-page code { background: var(--panel); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--gold-hi); font-size: .9rem; }
  .legal-page .warning-box { background: #f8717110; border: 1px solid #f8717140; border-radius: 12px; padding: 16px 20px; margin: 20px 0; }
  .legal-page .warning-box strong { color: #f87171; }
</style>
</head>
<body>
<div id="dust" aria-hidden="true"></div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
    <div id="server-selector"></div>
    <div id="acct"></div>
  </div>
</header>

<main class="wrap">
  <a class="back" href="./" style="margin-bottom:20px">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
    <span id="t-back">الرجوع للرئيسية</span>
  </a>

  <div class="legal-page">
    <h1 id="t-title">📜 شروط الخدمة</h1>
    <p class="last-update"><span id="t-last">آخر تحديث</span>: 2026-01-01</p>

    <p id="t-intro"></p>

    <h2 id="t-h1"></h2><p id="t-h1b"></p>
    <h2 id="t-h2"></h2><p id="t-h2b"></p>
    <h2 id="t-h3"></h2><p id="t-h3b"></p><ul id="t-h3l"></ul>
    <h2 id="t-h4"></h2><p id="t-h4b"></p><ul id="t-h4l"></ul>
    <h2 id="t-h5"></h2><p id="t-h5b"></p><ul id="t-h5l"></ul>
    <h2 id="t-h6"></h2><p id="t-h6b"></p>
    <h2 id="t-h7"></h2><p><span id="t-h7b"></span> <a href="privacy.html" style="color:var(--gold-hi)" id="t-h7l"></a>.</p>
    <h2 id="t-h8"></h2><p id="t-h8b"></p><ul id="t-h8l"></ul><p id="t-h8b2"></p>
    <h2 id="t-h9"></h2><p id="t-h9b"></p><ul id="t-h9l"></ul>
    <h2 id="t-h10"></h2><p id="t-h10b"></p>
    <h2 id="t-h11"></h2><p id="t-h11b"></p>
    <h2 id="t-h12"></h2><p id="t-h12b"></p>
    <ul>
      <li><span id="t-email"></span> <code>support@trof.dpdns.org</code></li>
      <li><span id="t-discord"></span> TROF System Server</li>
    </ul>

    <div class="warning-box">
      <p><strong id="t-warn"></strong> <span id="t-warnb"></span></p>
    </div>

    <p style="margin-top:40px;text-align:center;color:var(--muted);font-size:.9rem" id="t-copy"></p>
  </div>
</main>

<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
TROF.dust();
TROF.load(function(){
  TROF.mountAccount();
  TROF.renderServerSelector();

  var T = TROF.t;
  document.title = T('termsPageTitle');
  document.getElementById('t-back').textContent = T('termsBack');
  document.getElementById('t-title').textContent = T('termsTitle');
  document.getElementById('t-last').textContent = T('termsLastUpdate');
  document.getElementById('t-intro').textContent = T('termsIntro');
  document.getElementById('t-h1').textContent = T('termsH1');
  document.getElementById('t-h1b').textContent = T('termsH1Body');
  document.getElementById('t-h2').textContent = T('termsH2');
  document.getElementById('t-h2b').textContent = T('termsH2Body');
  document.getElementById('t-h3').textContent = T('termsH3');
  document.getElementById('t-h3b').textContent = T('termsH3Body');
  document.getElementById('t-h3l').innerHTML = T('termsH3List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('t-h4').textContent = T('termsH4');
  document.getElementById('t-h4b').textContent = T('termsH4Body');
  document.getElementById('t-h4l').innerHTML = T('termsH4List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('t-h5').textContent = T('termsH5');
  document.getElementById('t-h5b').textContent = T('termsH5Body');
  document.getElementById('t-h5l').innerHTML = T('termsH5List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('t-h6').textContent = T('termsH6');
  document.getElementById('t-h6b').textContent = T('termsH6Body');
  document.getElementById('t-h7').textContent = T('termsH7');
  document.getElementById('t-h7b').textContent = T('termsH7Body');
  document.getElementById('t-h7l').textContent = T('termsH7Link');
  document.getElementById('t-h8').textContent = T('termsH8');
  document.getElementById('t-h8b').textContent = T('termsH8Body');
  document.getElementById('t-h8l').innerHTML = T('termsH8List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('t-h8b2').textContent = T('termsH8Body2');
  document.getElementById('t-h9').textContent = T('termsH9');
  document.getElementById('t-h9b').textContent = T('termsH9Body');
  document.getElementById('t-h9l').innerHTML = T('termsH9List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('t-h10').textContent = T('termsH10');
  document.getElementById('t-h10b').textContent = T('termsH10Body');
  document.getElementById('t-h11').textContent = T('termsH11');
  document.getElementById('t-h11b').textContent = T('termsH11Body');
  document.getElementById('t-h12').textContent = T('termsH12');
  document.getElementById('t-h12b').textContent = T('termsH12Body');
  document.getElementById('t-email').textContent = T('termsContactEmail');
  document.getElementById('t-discord').textContent = T('termsContactDiscord');
  document.getElementById('t-warn').textContent = T('termsWarning');
  document.getElementById('t-warnb').textContent = T('termsWarningBody');
  document.getElementById('t-copy').textContent = T('termsCopyright');
});
</script>
</body>
</html>
