<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ملفي | TROF System</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ============================================
   Live Preview - يطابق profileImage.js
   ============================================ */
.live-preview {
  --text-color: #FFFFFF;
  --box-bg: rgba(0, 0, 0, 0.55);
  --box-border: rgba(255, 255, 255, 0.15);
  --accent: #FFD700;
  --border-color: #00d4d4;

  position: relative;
  width: 100%;
  max-width: 400px;
  aspect-ratio: 1;
  padding: 16px;
  margin: 0 auto;
  background: linear-gradient(135deg, #0a1628 0%, #1a3a4a 100%);
  border: 3px solid var(--border-color);
  border-radius: 16px;
  box-shadow: 0 0 0 2px var(--accent), 0 8px 30px -8px var(--border-color);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 4px;
  color: var(--text-color);
  overflow: hidden;
  box-sizing: border-box;
}

.preview-avatar-ring {
  position: relative;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--border-color), var(--accent), var(--border-color));
  padding: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.preview-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(135deg, var(--accent), var(--border-color));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  font-weight: 900;
  color: #0d0c0a;
}

.preview-name-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex-wrap: wrap;
  max-width: 100%;
  padding: 0 6px;
}

.preview-name {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--text-color);
  text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

.preview-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 5px;
  font-size: 0.65rem;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
  white-space: nowrap;
  flex-shrink: 0;
}

.vip-badge {
  background: #0a1628;
  color: #00D4D4;
  border: 1.5px solid #00D4D4;
  box-shadow: 0 0 8px rgba(0, 212, 212, 0.4);
}

.premium-badge {
  background: #1a0a28;
  color: #E0BBE4;
  border: 1.5px solid #E0BBE4;
  box-shadow: 0 0 8px rgba(224, 187, 228, 0.4);
}

.preview-handle {
  font-size: .75rem;
  color: rgba(255,255,255,0.6);
  margin-top: -2px;
}

.preview-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  width: 100%;
  margin-top: 8px;
}

.preview-box {
  padding: 8px 10px;
  background: var(--box-bg);
  border: 1.5px solid var(--box-border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.preview-box-label {
  font-size: .6rem;
  font-weight: 700;
  color: rgba(255,255,255,0.65);
  letter-spacing: 1px;
}

.preview-box-value {
  font-size: .95rem;
  font-weight: 900;
  color: var(--text-color);
}

.preview-progress-container {
  width: 100%;
  margin-top: 6px;
  position: relative;
}

.preview-progress {
  width: 100%;
  height: 16px;
  background: rgba(0,0,0,0.75);
  border: 1.5px solid var(--box-border);
  border-radius: 8px;
  overflow: hidden;
  position: relative;
}

.preview-progress-fill {
  width: 52%;
  height: 100%;
  background: linear-gradient(90deg, #F2C23C, #FF9500);
  border-radius: 6px;
  transition: width .3s;
}

.preview-progress-label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: .6rem;
  font-weight: 900;
  color: #000;
  text-shadow: 0 0 3px rgba(255,255,255,0.5);
  pointer-events: none;
}

.preview-progress-info {
  display: flex;
  justify-content: space-between;
  font-size: .65rem;
  font-weight: 700;
  margin-top: 3px;
}

.preview-progress-info .left {
  color: var(--accent);
}

.preview-progress-info .right {
  color: rgba(255,255,255,0.8);
}

.preview-badges-row {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 10px;
}

.preview-badge-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  background: linear-gradient(135deg, #5865F2, #3449BA);
  border: 1.5px solid rgba(255,255,255,0.9);
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

@media (max-width: 480px) {
  .live-preview {
    padding: 12px;
  }
  .preview-avatar-ring {
    width: 65px;
    height: 65px;
  }
  .preview-name {
    font-size: 1rem;
  }
  .preview-box-value {
    font-size: 0.85rem;
  }
}
</style>
</head>
<body data-title="profile">
<div id="dust" aria-hidden="true"></div>
<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
    <div id="acct"></div>
    <div id="server-selector"></div>
  </div>
</header>
<main class="wrap page" id="page"></main>
<footer class="wrap">TROF System.</footer>
<script src="app.js"></script>
<script>
var CHEV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';
TROF.dust();

TROF.load(function(){
  TROF.mountAccount();
  TROF.renderServerSelector();
  var u=TROF.auth.user,page=document.getElementById('page'),n=0;
  function r(){return ' rise" style="--d:'+(n++)}
  var h='<a class="back'+r()+'" href="./">'+CHEV+TROF.t('back')+'</a>';
  if(!u){
    page.innerHTML=h+'<p class="soon'+r()+'">'+TROF.t('profileLogin')+'</p>';
    return;
  }

  var gid = TROF.getSelectedGuild();

  // بيانات الملف
  h+='<div class="pf'+r()+'"><div class="sec-ic pf-av"><span class="ring"></span><img class="face" alt="" src="'+TROF.avatar(128)+'"></div><div><h1 class="sec-title" id="nm"></h1><p id="un"></p></div></div>';

  h+='<div class="stats'+r()+'">' +
     '<div class="stat"><i>💰</i><b id="s-bal">—</b><span>'+TROF.t('balance')+'</span></div>' +
     '<div class="stat"><i>📊</i><b id="s-lvl">—</b><span>'+TROF.t('level')+'</span></div>' +
     '<div class="stat"><i>🏆</i><b id="s-rank">—</b><span>'+TROF.t('rank')+'</span></div>' +
     '</div>';

  // بطاقة المكافأة اليومية
  h+='<div class="daily-card'+r()+'">' +
     '<div class="daily-header">' +
       '<span class="daily-icon">🎁</span>' +
       '<div>' +
         '<b>المكافأة اليومية</b>' +
         '<small id="daily-status">جاري التحقق...</small>' +
       '</div>' +
     '</div>' +
     '<button class="daily-btn" id="daily-btn" type="button" disabled>🎁 استلام المكافأة</button>' +
     '</div>';

  // زر فتح قسم التخصيص
  h+='<button class="open-colors-btn" id="open-colors-btn" type="button">' +
     '<span>🎨 تخصيص ألوان البروفايل</span>' +
     '<span class="arrow">▼</span>' +
     '</button>';

  // قسم التخصيص (مخفي افتراضياً)
  h+='<div class="colors-section" id="colors-section" style="display:none">' +
     '<div class="form-section-title">🎨 تخصيص ألوان البروفايل</div>' +

     '<div class="form-row form-row-col">' +
       '<label class="form-label">📋 قوالب جاهزة</label>' +
       '<div class="templates-grid" id="templates-grid"></div>' +
     '</div>' +

     '<div class="form-row form-row-col">' +
       '<label class="form-label">🎨 الألوان</label>' +
       '<div class="color-pickers">' +
         '<div class="color-picker-item"><label>لون النص</label><input type="color" id="c-text" value="#FFFFFF"></div>' +
         '<div class="color-picker-item"><label>خلفية المربعات</label><input type="color" id="c-box-bg" value="#000000"></div>' +
         '<div class="color-picker-item"><label>حدود المربعات</label><input type="color" id="c-box-border" value="#FFFFFF"></div>' +
         '<div class="color-picker-item"><label>اللون المميز (XP)</label><input type="color" id="c-accent" value="#FFD700"></div>' +
         '<div class="color-picker-item"><label>لون الإطار</label><input type="color" id="c-border" value="#00d4d4"></div>' +
       '</div>' +
     '</div>' +

     // المعاينة الحية
     '<div class="form-row form-row-col">' +
       '<label class="form-label">👁️ المعاينة الحية</label>' +
       '<div class="preview-container" style="width:100%;display:flex;justify-content:center;padding:10px 0;background:var(--bg);border-radius:14px;border:1px solid var(--line)">' +
         '<div class="live-preview" id="live-preview">' +
           '<div class="preview-avatar-ring">' +
             '<img class="preview-avatar" id="pv-avatar" src="' + TROF.avatar(128) + '" alt="">' +
           '</div>' +
           '<div class="preview-name-row" id="pv-name-row">' +
             '<span class="preview-name" id="pv-name">' + (u.global_name || u.username) + '</span>' +
           '</div>' +
           '<div class="preview-handle">@' + u.username + '</div>' +
           '<div class="preview-stats">' +
             '<div class="preview-box"><div class="preview-box-label">LVL</div><div class="preview-box-value" id="pv-level">0</div></div>' +
             '<div class="preview-box"><div class="preview-box-label">XP</div><div class="preview-box-value" id="pv-xp">0</div></div>' +
             '<div class="preview-box"><div class="preview-box-label">RANK</div><div class="preview-box-value" id="pv-rank">#0</div></div>' +
             '<div class="preview-box"><div class="preview-box-label">CREDITS</div><div class="preview-box-value" id="pv-balance">0</div></div>' +
           '</div>' +
           '<div class="preview-progress-container">' +
             '<div class="preview-progress">' +
               '<div class="preview-progress-fill" id="pv-progress"></div>' +
               '<div class="preview-progress-label" id="pv-progress-label">52%</div>' +
             '</div>' +
             '<div class="preview-progress-info">' +
               '<span class="left" id="pv-xp-text">0 / 900</span>' +
               '<span class="right" id="pv-total-xp">TOTAL XP: 0</span>' +
             '</div>' +
           '</div>' +
           '<div class="preview-badges-row" id="pv-badges"></div>' +
         '</div>' +
       '</div>' +
     '</div>' +

     '<div class="form-actions">' +
       '<button class="btn save-btn" id="save-colors" type="button">💾 حفظ الألوان</button>' +
       '<p class="save-msg" id="colors-msg"></p>' +
     '</div>' +
     '</div>';

  h+='<p class="note2'+r()+'" id="note"></p>';
  h+='<button class="btn alt'+r()+'" id="out" type="button">'+TROF.t('logout')+'</button>';
  page.innerHTML=h;

  document.getElementById('nm').textContent=u.global_name||u.username||'';
  document.getElementById('un').textContent='@'+(u.username||'')+' | '+TROF.roleName();
  document.getElementById('out').onclick=function(){TROF.logout()};

  var note=document.getElementById('note');
  function count(el,v){
    if(typeof v!=='number'||matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=v==null?'—':v.toLocaleString('en');return}
    var t0=performance.now();
    (function step(t){var k=Math.min((t-t0)/900,1);el.textContent=Math.round(v*(1-Math.pow(1-k,3))).toLocaleString('en');if(k<1)requestAnimationFrame(step)})(t0);
  }

  var api=TROF.CONFIG.apiUrl;
  var userData = {}; // لحفظ بيانات المستخدم

  // ============================================
  // جلب البيانات من API
  // ============================================
  fetch(api.replace(/\/$/,'')+'/users/'+u.id,{headers:{Authorization:'Bearer '+TROF.token()}})
    .then(function(x){if(!x.ok)throw 0;return x.json()})
    .then(function(d){
      userData = d;
      document.getElementById('s-bal').textContent = TROF.formatNumber(d.balance);
      count(document.getElementById('s-lvl'), d.level);
      count(document.getElementById('s-rank'), d.rank);
      // تحديث المعاينة
      var pvLevel = document.getElementById('pv-level');
      if(pvLevel) pvLevel.textContent = d.level || 0;
      var pvXp = document.getElementById('pv-xp');
      if(pvXp) pvXp.textContent = TROF.formatNumber(d.total_xp || 0);
      var pvBalance = document.getElementById('pv-balance');
      if(pvBalance) pvBalance.textContent = TROF.formatNumber(d.balance);
      var pvRank = document.getElementById('pv-rank');
      if(pvRank) pvRank.textContent = '#' + (d.rank || '0');
      var pvProgress = document.getElementById('pv-progress');
      if(pvProgress){
        var pct = Math.min(((d.xp || 0) / ((d.level + 1) * 100)) * 100, 100);
        pvProgress.style.width = pct + '%';
        document.getElementById('pv-progress-label').textContent = Math.round(pct) + '%';
      }
      var pvXpText = document.getElementById('pv-xp-text');
      if(pvXpText) pvXpText.textContent = TROF.formatNumber(d.xp || 0) + ' / ' + TROF.formatNumber((d.level + 1) * 100);
      var pvTotalXp = document.getElementById('pv-total-xp');
      if(pvTotalXp) pvTotalXp.textContent = 'TOTAL XP: ' + TROF.formatNumber(d.total_xp || 0);
    })
    .catch(function(){note.textContent=TROF.t('apiErr')});

  // ============================================
  // 🎖️ فحص VIP/Premium
  // ============================================
  if (gid) {
    var userIsVIP = false;
    var userIsPremium = false;

    Promise.all([
      fetch(api + '/premium/status?user_id=' + u.id + '&guild_id=' + gid, {
        headers: {Authorization: 'Bearer ' + TROF.token()}
      }).then(function(r){return r.json()}).catch(function(){return {}}),
      fetch(api + '/vip/status?user_id=' + u.id + '&guild_id=' + gid, {
        headers: {Authorization: 'Bearer ' + TROF.token()}
      }).then(function(r){return r.json()}).catch(function(){return {}})
    ]).then(function(results){
      var premiumData = results[0] || {};
      var vipData = results[1] || {};

      userIsPremium = !!premiumData.is_premium;
      userIsVIP = !!vipData.is_vip;

      updateBadges();
    });
  }

  // ============================================
  // 🏷️ إضافة الشارة قبل الاسم
  // ============================================
  function updateBadges() {
    var nameRow = document.getElementById('pv-name-row');
    if (!nameRow) return;

    var displayName = u.global_name || u.username;
    var badgeHTML = '';

    if (userIsPremium) {
      badgeHTML = '<span class="preview-badge premium-badge">PREMIUM</span>';
    } else if (userIsVIP) {
      badgeHTML = '<span class="preview-badge vip-badge">VIP</span>';
    }

    nameRow.innerHTML = badgeHTML + '<span class="preview-name">' + displayName + '</span>';
  }

  // ============================================
  // 🎁 المكافأة اليومية
  // ============================================
  var dailyBtn = document.getElementById('daily-btn');
  var dailyStatus = document.getElementById('daily-status');

  function updateDailyStatus(){
    fetch(api + '/user/' + u.id + '/daily/status', {headers: {Authorization: 'Bearer ' + TROF.token()}})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.can_claim){
          dailyBtn.disabled = false;
          dailyStatus.textContent = 'يمكنك الاستلام الآن!';
          dailyStatus.style.color = '#4ade80';
        }else{
          dailyBtn.disabled = true;
          var hours = Math.floor(d.time_left / 3600);
          var minutes = Math.floor((d.time_left % 3600) / 60);
          dailyStatus.textContent = 'انتظر ' + hours + 'س ' + minutes + 'د';
          dailyStatus.style.color = '#f2c23c';
        }
      })
      .catch(function(){ dailyStatus.textContent = 'خطأ'; });
  }

  dailyBtn.onclick = function(){
    dailyBtn.disabled = true;
    dailyStatus.textContent = '⏳...';
    fetch(api + '/user/' + u.id + '/daily/claim', {method: 'POST', headers: {Authorization: 'Bearer ' + TROF.token()}})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.success){
          dailyStatus.textContent = '✅ +' + d.reward + ' 💰';
          dailyStatus.style.color = '#4ade80';
          var balEl = document.getElementById('s-bal');
          if(balEl) balEl.textContent = TROF.formatNumber(d.new_balance);
          setTimeout(updateDailyStatus, 2000);
        }else{
          dailyStatus.textContent = '❌ ' + (d.detail || 'فشل');
          dailyStatus.style.color = '#f87171';
          dailyBtn.disabled = false;
        }
      })
      .catch(function(){ dailyStatus.textContent = '❌ خطأ'; dailyBtn.disabled = false; });
  };

  updateDailyStatus();
  setInterval(updateDailyStatus, 60000);

  // ============================================
  // 🎨 قسم التخصيص
  // ============================================
  var colorsBtn = document.getElementById('open-colors-btn');
  var colorsSection = document.getElementById('colors-section');
  var colorsOpened = false;
  var colorsInitialized = false;

  colorsBtn.onclick = function() {
    colorsOpened = !colorsOpened;
    colorsBtn.classList.toggle('open', colorsOpened);

    if (colorsOpened) {
      colorsSection.style.display = 'grid';
      if (!colorsInitialized) {
        colorsInitialized = true;
        initColorsSection();
      }
    } else {
      colorsSection.style.display = 'none';
    }
  };

  function initColorsSection() {
    var TEMPLATES = [
      {name: "افتراضي", text: "#FFFFFF", boxBg: "#000000", boxBorder: "#FFFFFF", accent: "#FFD700", border: "#00d4d4"},
      {name: "ذهبي", text: "#FFD700", boxBg: "#1a1305", boxBorder: "#FFD700", accent: "#FFD700", border: "#FFD700"},
      {name: "فضي", text: "#FFFFFF", boxBg: "#1a1a1a", boxBorder: "#C0C0C0", accent: "#C0C0C0", border: "#C0C0C0"},
      {name: "أزرق", text: "#FFFFFF", boxBg: "#0a1628", boxBorder: "#00BFFF", accent: "#00BFFF", border: "#00BFFF"},
      {name: "بنفسجي", text: "#FFFFFF", boxBg: "#1a0a28", boxBorder: "#9B59B6", accent: "#9B59B6", border: "#9B59B6"},
      {name: "أحمر", text: "#FFFFFF", boxBg: "#1a0505", boxBorder: "#E74C3C", accent: "#E74C3C", border: "#E74C3C"},
      {name: "أخضر", text: "#FFFFFF", boxBg: "#051a05", boxBorder: "#2ECC71", accent: "#2ECC71", border: "#2ECC71"},
      {name: "برتقالي", text: "#FFFFFF", boxBg: "#1a0f05", boxBorder: "#E67E22", accent: "#E67E22", border: "#E67E22"},
      {name: "وردي", text: "#FFFFFF", boxBg: "#1a0510", boxBorder: "#FF69B4", accent: "#FF69B4", border: "#FF69B4"},
      {name: "أسود", text: "#FFFFFF", boxBg: "#000000", boxBorder: "#333333", accent: "#888888", border: "#333333"},
    ];

    var grid = document.getElementById('templates-grid');
    TEMPLATES.forEach(function(t){
      var btn = document.createElement('button');
      btn.className = 'template-btn';
      btn.type = 'button';
      btn.innerHTML = '<span class="template-preview" style="background:linear-gradient(135deg, ' + t.border + ' 0%, ' + t.accent + ' 100%)"></span><span>' + t.name + '</span>';
      btn.onclick = function(){
        document.querySelectorAll('.template-btn').forEach(function(b){b.classList.remove('active')});
        btn.classList.add('active');
        document.getElementById('c-text').value = t.text;
        document.getElementById('c-box-bg').value = t.boxBg;
        document.getElementById('c-box-border').value = t.boxBorder;
        document.getElementById('c-accent').value = t.accent;
        document.getElementById('c-border').value = t.border;
        updatePreview();
      };
      grid.appendChild(btn);
    });

    fetch(api + '/user/' + u.id + '/profile/colors', {headers: {Authorization: 'Bearer ' + TROF.token()}})
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.colors){
          document.getElementById('c-text').value = d.colors.text_color || '#FFFFFF';
          document.getElementById('c-box-bg').value = convertRgbaToHex(d.colors.box_bg) || '#000000';
          document.getElementById('c-box-border').value = convertRgbaToHex(d.colors.box_border) || '#FFFFFF';
          document.getElementById('c-accent').value = d.colors.accent_color || '#FFD700';
          document.getElementById('c-border').value = d.colors.border_color || '#00d4d4';
        }
        updatePreview();
      })
      .catch(function(){ updatePreview(); });

    ['c-text', 'c-box-bg', 'c-box-border', 'c-accent', 'c-border'].forEach(function(id){
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    document.getElementById('save-colors').onclick = function(){
      var btn = this;
      btn.disabled = true;
      var msg = document.getElementById('colors-msg');
      msg.textContent = '⏳ جاري الحفظ...';
      fetch(api + '/user/' + u.id + '/profile/colors', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + TROF.token(), 'Content-Type': 'application/json'},
        body: JSON.stringify({
          text_color: document.getElementById('c-text').value,
          box_bg: hexToRgba(document.getElementById('c-box-bg').value, 0.5),
          box_border: hexToRgba(document.getElementById('c-box-border').value, 0.15),
          accent_color: document.getElementById('c-accent').value,
          border_color: document.getElementById('c-border').value
        })
      })
      .then(function(r){return r.json()})
      .then(function(d){
        if(d.success){
          msg.textContent = '✅ تم الحفظ!';
          msg.style.color = '#4ade80';
        }else{
          msg.textContent = '❌ فشل';
          msg.style.color = '#f87171';
        }
      })
      .catch(function(){ msg.textContent = '❌ خطأ'; msg.style.color = '#f87171'; })
      .finally(function(){ btn.disabled = false; setTimeout(function(){ msg.textContent = ''; }, 3000); });
    };
  }

  function convertRgbaToHex(rgba){
    if(!rgba || rgba.indexOf('rgba') === -1) return rgba;
    var m = rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if(m){
      var r = parseInt(m[1]).toString(16).padStart(2, '0');
      var g = parseInt(m[2]).toString(16).padStart(2, '0');
      var b = parseInt(m[3]).toString(16).padStart(2, '0');
      return '#' + r + g + b;
    }
    return rgba;
  }

  function hexToRgba(hex, alpha){
    var r = parseInt(hex.slice(1,3), 16);
    var g = parseInt(hex.slice(3,5), 16);
    var b = parseInt(hex.slice(5,7), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  var previewTimeout;
  function updatePreview(){
    clearTimeout(previewTimeout);
    previewTimeout = setTimeout(function(){
      var textColor = document.getElementById('c-text').value;
      var boxBg = document.getElementById('c-box-bg').value;
      var boxBorder = document.getElementById('c-box-border').value;
      var accent = document.getElementById('c-accent').value;
      var border = document.getElementById('c-border').value;

      var preview = document.getElementById('live-preview');
      if (!preview) return;

      preview.style.setProperty('--text-color', textColor);
      preview.style.setProperty('--box-bg', hexToRgba(boxBg, 0.55));
      preview.style.setProperty('--box-border', hexToRgba(boxBorder, 0.2));
      preview.style.setProperty('--accent', accent);
      preview.style.setProperty('--border-color', border);
    }, 200);
  }
});
</script>
