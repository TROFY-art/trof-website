<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صوّت للبوت | TROF System</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .vote-hero {
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #0a2818 0%, #1a4a2a 100%);
    border: 2px solid #2ECC71;
    border-radius: 24px;
    margin-bottom: 30px;
    box-shadow: 0 20px 60px -20px #2ECC7144;
  }
  .vote-hero h1 {
    font-size: clamp(1.8rem, 6vw, 2.5rem);
    margin: 0 0 10px;
    background: linear-gradient(180deg, #A8F0C0, #2ECC71 50%, #1E8449);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 900;
  }
  .vote-hero p { color: #a89f88; margin: 0 0 20px; font-size: 1.05rem; }
  .vote-reward {
    display: inline-block;
    padding: 10px 24px;
    background: linear-gradient(180deg, #A8F0C0, #2ECC71);
    color: #0a2818;
    border-radius: 999px;
    font-weight: 900;
    font-size: 1.1rem;
    box-shadow: 0 4px 20px -4px #2ECC71;
  }
  .vote-container { max-width: 900px; margin: 0 auto; }

  /* شريط الحالة */
  .vote-status-bar {
    padding: 20px;
    border-radius: 16px;
    text-align: center;
    margin-bottom: 20px;
    font-weight: 800;
    font-size: 1.05rem;
  }
  .vote-status-bar.ready {
    background: linear-gradient(135deg, #0a2818, #1a4a2a);
    border: 2px solid #2ECC71;
    color: #A8F0C0;
  }
  .vote-status-bar.cooldown {
    background: linear-gradient(135deg, #1a1305, #2a1f08);
    border: 2px solid #F2C23C;
    color: #FFE9A3;
  }
  .vote-status-bar.login {
    background: linear-gradient(135deg, #1a0a28, #2a1240);
    border: 2px solid #9B59B6;
    color: #E0BBE4;
  }
  .vote-status-bar.loading {
    background: #171410;
    border: 2px solid #2f2818;
    color: #a89f88;
  }

  /* الإحصائيات */
  .vote-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .vote-stat {
    padding: 20px 12px;
    background: #171410;
    border: 1px solid #2f2818;
    border-radius: 16px;
    text-align: center;
    transition: border-color .2s;
  }
  .vote-stat:hover { border-color: #2ECC71; }
  .vote-stat b {
    display: block;
    font-size: 1.8rem;
    font-weight: 900;
    color: #A8F0C0;
    margin-bottom: 4px;
  }
  .vote-stat span {
    color: #a89f88;
    font-size: .85rem;
  }

  /* مواقع التصويت */
  .vote-sites-title {
    color: #A8F0C0;
    margin: 0 0 16px;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .vote-sites {
    display: grid;
    gap: 12px;
    margin-bottom: 30px;
  }
  .vote-site {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: #171410;
    border: 2px solid #2f2818;
    border-radius: 16px;
    text-decoration: none;
    color: inherit;
    transition: all .2s;
  }
  .vote-site:hover {
    border-color: #2ECC71;
    transform: translateY(-3px);
    box-shadow: 0 10px 30px -10px #2ECC7155;
  }
  .vote-site-icon {
    width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.7rem;
    background: #0d0c0a;
    border-radius: 14px;
    flex-shrink: 0;
    border: 1px solid #2f2818;
  }
  .vote-site-info { flex: 1; min-width: 0; }
  .vote-site-info b {
    display: block;
    color: #A8F0C0;
    font-size: 1.05rem;
    margin-bottom: 4px;
    font-weight: 800;
  }
  .vote-site-info small {
    color: #a89f88;
    font-size: .85rem;
  }
  .vote-site-reward {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 14px;
    background: linear-gradient(180deg, #A8F0C0, #2ECC71);
    color: #0a2818;
    border-radius: 12px;
    font-weight: 900;
    flex-shrink: 0;
  }
  .vote-site-reward b { font-size: 1rem; line-height: 1; }
  .vote-site-reward small { font-size: .7rem; opacity: .85; margin-top: 3px; }

  /* ليدربورد */
  .leaderboard {
    background: #171410;
    border: 1px solid #2f2818;
    border-radius: 16px;
    padding: 20px;
  }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #0d0c0a;
    margin-bottom: 8px;
    border: 1px solid #2f2818;
    transition: border-color .2s;
  }
  .lb-row:hover { border-color: #2ECC71; }
  .lb-rank {
    font-size: 1.2rem;
    font-weight: 900;
    min-width: 40px;
    text-align: center;
  }
  .lb-name {
    flex: 1;
    color: #f6efdc;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-count {
    color: #2ECC71;
    font-weight: 800;
    white-space: nowrap;
  }
  .empty-state {
    text-align: center;
    padding: 30px 20px;
    color: #a89f88;
  }
  .empty-state span { display: block; font-size: 2rem; margin-bottom: 8px; }

  @media (max-width: 640px) {
    .vote-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .vote-stat { padding: 14px 8px; }
    .vote-stat b { font-size: 1.4rem; }
    .vote-stat span { font-size: .72rem; }
    .vote-site { padding: 14px; gap: 12px; }
    .vote-site-icon { width: 45px; height: 45px; font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div id="dust" aria-hidden="true"></div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
    <div id="acct"></div>
    <div id="server-selector"></div>
  </div>
</header>

<main class="wrap">
  <a class="back" href="./" style="margin-bottom:20px">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
    <span>الرجوع للرئيسية</span>
  </a>

  <div class="vote-container">
    <div class="vote-hero">
      <h1>🗳️ صوّت للبوت</h1>
      <p>كل تصويت يساعدنا على الوصول لعدد أكبر من المستخدمين</p>
      <div class="vote-reward">💰 كل تصويت = 5,000 💰</div>
    </div>

    <!-- شريط الحالة -->
    <div class="vote-status-bar loading" id="vote-status">
      ⏳ جاري التحقق...
    </div>

    <!-- الإحصائيات -->
    <div class="vote-stats">
      <div class="vote-stat">
        <b id="stat-total">0</b>
        <span>إجمالي التصويتات</span>
      </div>
      <div class="vote-stat">
        <b id="stat-month">0</b>
        <span>هذا الشهر</span>
      </div>
      <div class="vote-stat">
        <b id="stat-rank">—</b>
        <span>ترتيبك</span>
      </div>
    </div>

    <!-- مواقع التصويت -->
    <h3 class="vote-sites-title">🎯 مواقع التصويت</h3>
    <div class="vote-sites" id="vote-sites">
      <div class="empty-state">
        <span>⏳</span>
        جاري التحميل...
      </div>
    </div>

    <!-- أفضل المصوتين -->
    <h3 class="vote-sites-title">🏆 أفضل 10 مصوتين</h3>
    <div class="leaderboard" id="leaderboard">
      <div class="empty-state">
        <span>⏳</span>
        جاري التحميل...
      </div>
    </div>
  </div>
</main>

<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
(function(){
TROF.dust();

// ============================================
// ⚙️ الإعدادات
// ============================================
var VOTE_REWARD = 5000;
var COOLDOWN_HOURS = 12;

// مواقع التصويت
var VOTE_SITES = [
  {
    name: 'top.gg',
    url: 'https://top.gg/bot/1536360221906178088/vote',
    icon: '🏆',
    reward: VOTE_REWARD,
  },
  {
    name: 'discordbotlist.com',
    url: 'https://discordbotlist.com/bots/1536360221906178088/upvote',
    icon: '🤖',
    reward: 3000,
  },
  {
    name: 'discordboats.com',
    url: 'https://discord.boats/bot/1536360221906178088/vote',
    icon: '⛵',
    reward: 3000,
  },
];

// ============================================
// 🎯 تحميل الصفحة
// ============================================
TROF.load(function(){
  TROF.mountAccount();
  TROF.renderServerSelector();

  var api = TROF.CONFIG.apiUrl;

  // ============================================
  // 🎯 مواقع التصويت
  // ============================================
  var sitesHTML = '';
  VOTE_SITES.forEach(function(site){
    sitesHTML += '<a class="vote-site" href="' + site.url + '" target="_blank" rel="noopener">';
    sitesHTML += '<div class="vote-site-icon">' + site.icon + '</div>';
    sitesHTML += '<div class="vote-site-info">';
    sitesHTML += '<b>' + site.name + '</b>';
    sitesHTML += '<small>اضغط للتصويت للبوت</small>';
    sitesHTML += '</div>';
    sitesHTML += '<div class="vote-site-reward">';
    sitesHTML += '<b>+' + TROF.formatNumber(site.reward) + '</b>';
    sitesHTML += '<small>💰</small>';
    sitesHTML += '</div>';
    sitesHTML += '</a>';
  });
  document.getElementById('vote-sites').innerHTML = sitesHTML;

  // ============================================
  // 👤 حالة المستخدم
  // ============================================
  if (!TROF.auth.user) {
    var statusEl = document.getElementById('vote-status');
    statusEl.className = 'vote-status-bar login';
    statusEl.innerHTML = '🔒 سجّل دخول للتصويت';
    return;
  }

  fetch(api + '/vote/check/' + TROF.auth.user.id)
    .then(function(r){ return r.json(); })
    .then(function(data){
      var statusEl = document.getElementById('vote-status');
      if (data.can_vote) {
        statusEl.className = 'vote-status-bar ready';
        statusEl.innerHTML = '✅ يمكنك التصويت الآن!';
      } else {
        statusEl.className = 'vote-status-bar cooldown';
        statusEl.innerHTML = '⏰ يمكنك التصويت بعد **' + (data.hours_left || 0) + '** ساعة';
      }
    })
    .catch(function(){
      var statusEl = document.getElementById('vote-status');
      statusEl.className = 'vote-status-bar ready';
      statusEl.innerHTML = '✅ يمكنك التصويت الآن!';
    });

  // ============================================
  // 📊 إحصائيات المستخدم
  // ============================================
  fetch(api + '/vote/stats/' + TROF.auth.user.id)
    .then(function(r){ return r.json(); })
    .then(function(data){
      document.getElementById('stat-total').textContent = TROF.formatNumber(data.total || 0);
      document.getElementById('stat-month').textContent = TROF.formatNumber(data.this_month || 0);
      document.getElementById('stat-rank').textContent = data.rank ? '#' + data.rank : '—';
    })
    .catch(function(){});

  // ============================================
  // 🏆 أفضل 10 مصوتين
  // ============================================
  fetch(api + '/vote/leaderboard')
    .then(function(r){ return r.json(); })
    .then(function(data){
      var lb = document.getElementById('leaderboard');
      if (!data.leaderboard || data.leaderboard.length === 0) {
        lb.innerHTML = '<div class="empty-state"><span>🗳️</span>لا توجد تصويتات بعد<br>كن الأول!</div>';
        return;
      }

      var medals = ['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'];
      var html = '';
      data.leaderboard.forEach(function(v){
        var medal = medals[v.rank - 1] || ('#' + v.rank);
        html += '<div class="lb-row">';
        html += '<span class="lb-rank">' + medal + '</span>';
        html += '<span class="lb-name">' + (v.username || ('<@' + v.user_id + '>')) + '</span>';
        html += '<span class="lb-count">' + v.count + ' تصويت</span>';
        html += '</div>';
      });
      lb.innerHTML = html;
    })
    .catch(function(){
      document.getElementById('leaderboard').innerHTML = '<div class="empty-state"><span>⚠️</span>خطأ في التحميل</div>';
    });
});
})();
</script>
</body>
</html>
