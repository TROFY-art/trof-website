var currentGuildId = null;
var existingShortcuts = {};

TROF.load(function(){
  TROF.mountAccount();
  TROF.renderServerSelector();
  var page=document.getElementById('page');
  var u=TROF.auth.user;

  if(!u){
    page.innerHTML='<p class="soon">سجّل الدخول للوصول للإعدادات.</p>';
    return;
  }

  currentGuildId = TROF.getSelectedGuild();
  if(!currentGuildId){
    page.innerHTML='<p class="soon">⚠️ اختر سيرفراً أولاً من القائمة العلوية.</p>';
    return;
  }

  page.innerHTML = buildShortcutsPage();
  loadExistingShortcuts(currentGuildId);
  bindEvents();
});

function buildShortcutsPage(){
  return '' +
  '<div class="sec-head"><div class="sec-ic"><span class="ring"></span><span class="face">⚡</span></div><div><h1 class="sec-title">الاختصارات</h1><p>أنشئ اختصارات لكل أمر في البوت</p></div></div>' +

  '<div class="shortcuts-search">' +
    '<input type="text" class="form-select" id="sc-search" placeholder="🔍 ابحث عن أمر...">' +
  '</div>' +

  '<div class="commands-container" id="commands-container">' +
    buildCommandsHTML() +
  '</div>' +

  '<div class="modal" id="shortcut-modal" hidden>' +
    '<div class="modal-content">' +
      '<div class="modal-header">' +
        '<h3 id="modal-title">إضافة اختصار</h3>' +
        '<button class="modal-close" id="modal-close" type="button">✕</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="form-row form-row-col">' +
          '<label class="form-label">📝 الأمر الأصلي</label>' +
          '<input type="text" class="form-select" id="m-command" readonly style="background:var(--bg);color:var(--gold);font-weight:800;direction:ltr;text-align:left;">' +
        '</div>' +
        '<div class="form-row form-row-col">' +
          '<label class="form-label">⚡ اسم الاختصار</label>' +
          '<input type="text" class="form-select" id="m-shortcut" placeholder="مثال: clr" maxlength="20" autocomplete="off">' +
          '<p class="form-hint">سيُستخدم كـ <code>!اسم_الاختصار</code> في Discord</p>' +
        '</div>' +
      '</div>' +
      '<div class="modal-footer">' +
        '<button class="btn" id="m-save" type="button">💾 حفظ</button>' +
        '<button class="btn alt" id="m-cancel" type="button">إلغاء</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function buildCommandsHTML(filter){
  var html = '';
  var filterLower = (filter || '').toLowerCase();

  for(var category in COMMANDS){
    var cat = COMMANDS[category];
    var matchingCommands = cat.commands.filter(function(c){
      if(!filterLower) return true;
      return c.name.toLowerCase().indexOf(filterLower) > -1 ||
             c.desc.toLowerCase().indexOf(filterLower) > -1 ||
             category.toLowerCase().indexOf(filterLower) > -1;
    });

    if(matchingCommands.length === 0) continue;

    html += '<div class="category-section">';
    html += '<div class="category-header" data-category="' + category + '">';
    html += '<span class="category-icon">' + cat.icon + '</span>';
    html += '<span class="category-name">' + category + '</span>';
    html += '<span class="category-count">' + matchingCommands.length + '</span>';
    html += '<span class="category-arrow">▼</span>';
    html += '</div>';
    html += '<div class="category-commands" data-category-body="' + category + '">';

    matchingCommands.forEach(function(cmd){
      var hasShortcut = existingShortcuts[cmd.name] || existingShortcuts[cmd.name.replace('/', '')];
      var shortcutName = hasShortcut ? hasShortcut : '';

      html += '<div class="command-item">';
      html += '<div class="command-info">';
      html += '<code class="command-name">' + cmd.name + '</code>';
      html += '<span class="command-desc">' + cmd.desc + '</span>';
      html += '</div>';

      if(shortcutName){
        html += '<div class="shortcut-badge" title="الاختصار الحالي">!' + shortcutName + '</div>';
        html += '<button class="btn small-btn remove-shortcut" data-command="' + cmd.name + '" data-shortcut="' + shortcutName + '">🗑️</button>';
      }else{
        html += '<button class="btn small-btn add-shortcut" data-command="' + cmd.name + '" data-desc="' + cmd.desc + '">➕ اختصار</button>';
      }

      html += '</div>';
    });

    html += '</div>';
    html += '</div>';
  }

  if(!html){
    html = '<p class="form-hint" style="text-align:center;padding:30px;">لا توجد نتائج للبحث</p>';
  }

  return html;
}

async function loadExistingShortcuts(gid){
  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/guild/' + gid + '/shortcuts', {
      headers: {Authorization: 'Bearer ' + TROF.token()}
    });

    if(res.ok){
      var data = await res.json();

      existingShortcuts = {};
      data.shortcuts.forEach(function(s){
        existingShortcuts[s.command] = s.shortcut;
      });

      refreshCommandsList();
    }
  }catch(e){
    console.error('Error loading shortcuts:', e);
  }
}

function refreshCommandsList(){
  var container = document.getElementById('commands-container');
  if(!container) return;
  var filter = document.getElementById('sc-search').value;
  container.innerHTML = buildCommandsHTML(filter);
  bindCommandButtons();
  bindCategoryToggles();
}

function bindCategoryToggles(){
  document.querySelectorAll('.category-header').forEach(function(header){
    header.onclick = function(){
      var category = header.getAttribute('data-category');
      var body = document.querySelector('[data-category-body="' + category + '"]');
      var arrow = header.querySelector('.category-arrow');
      var isOpen = body.style.display !== 'none';

      if(isOpen){
        body.style.display = 'none';
        arrow.textContent = '▶';
      }else{
        body.style.display = 'block';
        arrow.textContent = '▼';
      }
    };
  });

  var firstBody = document.querySelector('.category-commands');
  if(firstBody){
    firstBody.style.display = 'block';
    var firstArrow = firstBody.previousElementSibling.querySelector('.category-arrow');
    if(firstArrow) firstArrow.textContent = '▼';
  }
  document.querySelectorAll('.category-commands').forEach(function(body, i){
    if(i > 0) body.style.display = 'none';
  });
}

function bindCommandButtons(){
  document.querySelectorAll('.add-shortcut').forEach(function(btn){
    btn.onclick = function(e){
      e.stopPropagation();
      var command = btn.getAttribute('data-command');
      var desc = btn.getAttribute('data-desc');
      openShortcutModal(command, desc);
    };
  });

  document.querySelectorAll('.remove-shortcut').forEach(function(btn){
    btn.onclick = async function(e){
      e.stopPropagation();
      var shortcutName = btn.getAttribute('data-shortcut');
      var command = btn.getAttribute('data-command');

      if(!confirm('حذف الاختصار !' + shortcutName + '؟')) return;

      try{
        var res = await fetch(
          TROF.CONFIG.apiUrl + '/guild/' + currentGuildId + '/shortcuts/' + encodeURIComponent(shortcutName),
          {
            method: 'DELETE',
            headers: {Authorization: 'Bearer ' + TROF.token()}
          }
        );

        if(res.ok){
          delete existingShortcuts[command];
          refreshCommandsList();
        }else{
          var err = await res.json();
          alert('❌ ' + (err.detail || 'فشل الحذف'));
        }
      }catch(e){
        alert('❌ خطأ في الاتصال');
      }
    };
  });
}

function openShortcutModal(command, desc){
  var modal = document.getElementById('shortcut-modal');
  modal.hidden = false;

  document.getElementById('modal-title').textContent = 'إضافة اختصار لـ ' + command;
  document.getElementById('m-command').value = command;
  document.getElementById('m-shortcut').value = '';
  document.getElementById('m-shortcut').focus();
}

function closeShortcutModal(){
  document.getElementById('shortcut-modal').hidden = true;
}

async function saveShortcut(){
  var command = document.getElementById('m-command').value;
  var shortcut = document.getElementById('m-shortcut').value.trim();

  if(!shortcut){
    alert('❌ اكتب اسم الاختصار');
    return;
  }

  if(shortcut.indexOf(' ') > -1){
    alert('❌ الاختصار لا يجب أن يحتوي على مسافات');
    return;
  }

  var btn = document.getElementById('m-save');
  btn.disabled = true;
  btn.textContent = '⏳ جاري الحفظ...';

  try{
    var res = await fetch(TROF.CONFIG.apiUrl + '/guild/' + currentGuildId + '/shortcuts', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + TROF.token(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({shortcut: shortcut, command: command})
    });

    var data = await res.json();

    if(res.ok){
      existingShortcuts[command] = shortcut;
      closeShortcutModal();
      refreshCommandsList();
    }else{
      alert('❌ ' + (data.detail || 'فشل'));
    }
  }catch(e){
    alert('❌ خطأ في الاتصال');
  }

  btn.disabled = false;
  btn.textContent = '💾 حفظ';
}

function bindEvents(){
  var search = document.getElementById('sc-search');
  if(search){
    search.addEventListener('input', function(){
      refreshCommandsList();
    });
  }

  var closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.onclick = closeShortcutModal;

  var cancelBtn = document.getElementById('m-cancel');
  if(cancelBtn) cancelBtn.onclick = closeShortcutModal;

  var saveBtn = document.getElementById('m-save');
  if(saveBtn) saveBtn.onclick = saveShortcut;

  var modal = document.getElementById('shortcut-modal');
  if(modal){
    modal.onclick = function(e){
      if(e.target === modal) closeShortcutModal();
    };
  }

  var input = document.getElementById('m-shortcut');
  if(input){
    input.addEventListener('keypress', function(e){
      if(e.key === 'Enter') saveShortcut();
    });
  }

  bindCommandButtons();
  bindCategoryToggles();
}
})();
</script>
