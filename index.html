<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROF System | بوت دسكورد</title>
<meta name="description" content="TROF System: بوت دسكورد للمستويات والموسيقى والجيفاواي والتكتات والإدارة.">
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="home">
<div id="dust" aria-hidden="true"></div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
    <div id="server-selector"></div>
    <div id="acct"></div>
  </div>
</header>

<main class="wrap">
  <section id="main-view">
    <div class="hero">
      <div>
        <h1>TROF System</h1>
        <p class="lead" data-i18n="lead">بوت دسكورد واحد يدير سيرفرك كله: مستويات، موسيقى، جيفاواي، تكتات وأدوات إدارة.</p>
        <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1536360221906178088&permissions=1099780156598&scope=bot+applications.commands" data-i18n="addBot">أضف البوت إلى سيرفرك</a>
        <p class="note" data-i18n="note">مشروع غير تجاري.</p>
      </div>
      <div class="logo" id="logo">
        <span class="ring"></span>
        <div class="tilt" id="tilt"><img src="logo.webp" alt="شعار TROF System" width="640" height="640"></div>
      </div>
    </div>

    <div class="demo">
      <p data-i18n="tap">اضغط على أي قسم لفتح صفحته.</p>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="menu">
        <span class="menu-toggle-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7l9-4 9 4-9 4-9-4z"/>
            <path d="M3 12l9 4 9-4"/>
            <path d="M3 17l9 4 9-4"/>
          </svg>
        </span>
        <span class="menu-toggle-text" data-i18n="choose">📁 اختر قسماً...</span>
        <span class="menu-toggle-arrow">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </span>
      </button>

      <div class="menu" id="menu" aria-label="أقسام الأوامر">
        <ul id="list"></ul>
        <p class="hint" id="hint"></p>
      </div>
    </div>
  </section>
</main>

<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
(function(){
var root = document.documentElement;
var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
root.classList.add('js');

console.log('🔄 TROF System loading...');
console.log('   SECTIONS:', TROF.SECTIONS.length);

function buildMenu() {
  var list = document.getElementById('list');
  var hint = document.getElementById('hint');
  var menu = document.getElementById('menu');
  var toggle = document.getElementById('menu-toggle');

  if (!list) {
    console.error('❌ list element not found!');
    return;
  }

  var sections = TROF.SECTIONS || [];
  console.log('📋 Building menu with', sections.length, 'sections');
  console.log('   auth.rank:', TROF.auth ? TROF.auth.rank : 'N/A');

  var visibleSections = sections.filter(function(s) {
    if (!TROF.can) return true;
    return TROF.can(s);
  });

  console.log('   Visible sections:', visibleSections.length);

  if (visibleSections.length === 0) {
    console.warn('⚠️ No visible sections, showing all');
    visibleSections = sections;
  }

  list.innerHTML = visibleSections.map(function(s, i){
    var url = s.url ? s.url : 'section.html?p=' + s.id;
    var icon = TROF.getIconSVG ? TROF.getIconSVG(s.icon) : '📁';
    var name = TROF.name ? TROF.name(s) : s.t;
    var desc = TROF.desc ? TROF.desc(s) : s.d;

    return '<li><a class="row" style="--i:' + i + '" href="' + url + '">' +
      '<span class="ic ic-' + s.icon + '">' + icon + '</span>' +
      '<span><b>' + name + '</b><small>' + desc + '</small></span>' +
    '</a></li>';
  }).join('');

  console.log('✅ Menu built, HTML length:', list.innerHTML.length);

  // ✅ إظهار الصفوف
  menu.classList.add('in');

  TROF.mountAccount();
  TROF.renderServerSelector();

  if (!TROF.auth.user && hint) {
    hint.textContent = TROF.t('hint');
  }

  if (toggle && menu) {
    toggle.onclick = function(e){
      e.stopPropagation();
      var isOpen = menu.classList.contains('open');

      if (isOpen) {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      } else {
        menu.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
        setTimeout(function(){
          menu.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 250);
      }
    };

    document.addEventListener('click', function(e){
      if (!menu.contains(e.target) && !toggle.contains(e.target)) {
        if (menu.classList.contains('open')) {
          menu.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
        }
      }
    });

    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && menu.classList.contains('open')) {
        menu.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
    });
  }
}

setTimeout(function() {
  var list = document.getElementById('list');
  if (list && !list.innerHTML.trim()) {
    console.warn('⚠️ List empty after 500ms, forcing build');
    buildMenu();
  }
}, 500);

try {
  TROF.load(function(){
    console.log('✅ TROF.load callback fired');
    buildMenu();
  });
} catch (e) {
  console.error('❌ TROF.load failed:', e);
  buildMenu();
}

setTimeout(function() {
  var list = document.getElementById('list');
  if (list && !list.innerHTML.trim()) {
    console.warn('⚠️ List still empty after 3s, forcing build AGAIN');
    buildMenu();
  }
}, 3000);

var logo = document.getElementById('logo');
var tilt = document.getElementById('tilt');

if (!calm && logo && tilt) {
  logo.addEventListener('pointermove', function(e){
    var b = logo.getBoundingClientRect();
    var x = (e.clientX - b.left) / b.width - 0.5;
    var y = (e.clientY - b.top) / b.height - 0.5;
    tilt.style.transform = 'perspective(600px) rotateY(' + (x * 18) + 'deg) rotateX(' + (-y * 18) + 'deg) scale(1.03)';
  });
  logo.addEventListener('pointerleave', function(){
    tilt.style.transform = '';
  });
}
})();
</script>
</body>
</html>
