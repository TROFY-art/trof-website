<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TROF System | بوت دسكورد</title>
<meta name="description" content="TROF System: بوت دسكورد للمستويات والموسيقى والجيفاواي والتكتات والإدارة.">
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-title="home">
<div id="dust" aria-hidden="true"></div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
    <div id="server-selector"></div>
    <div id="acct"></div>
  </div>
</header>

<main class="wrap">
<!-- الصفحة الرئيسية -->
<section id="main-view">
  <div class="hero">
    <div>
      <h1>TROF System</h1>
      <p class="lead" data-i18n="lead">بوت دسكورد واحد يدير سيرفرك كله: مستويات، موسيقى، جيفاواي، تكتات وأدوات إدارة.</p>
      <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1536360221906178088&amp;permissions=8&amp;integration_type=0&amp;scope=bot" data-i18n="addBot">أضف البوت إلى سيرفرك</a>
      <p class="note" data-i18n="note">مشروع غير تجاري.</p>
    </div>
    <div class="logo" id="logo">
      <span class="ring"></span>
      <div class="tilt" id="tilt"><img src="logo.webp" alt="شعار TROF System" width="640" height="640"></div>
    </div>
  </div>

  <div class="demo">
    <p data-i18n="tap">اضغط على أي قسم لفتح صفحته.</p>
    <div class="menu" id="menu" aria-label="أقسام الأوامر">
      <div class="grab"></div>
      <h2 data-i18n="choose">📁 اختر قسماً...</h2>
      <ul id="list"></ul>
      <p class="hint" id="hint"></p>
    </div>
  </div>
</section>

<!-- صفحة القسم (تظهر عند الضغط) -->
<section id="section-view" hidden>
  <div class="section-header">
    <button class="back-btn" id="back-to-main" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
      <span>الرجوع للأقسام</span>
    </button>
    <h2 id="section-title"></h2>
  </div>
  <div id="section-body" class="section-body"></div>
</section>
</main>

<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
(function(){
var root=document.documentElement,calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
root.classList.add('js');

TROF.load(function(){
  var list=document.getElementById('list'),hint=document.getElementById('hint'),menu=document.getElementById('menu');
  list.innerHTML=TROF.SECTIONS.filter(TROF.can).map(function(s,i){
    var url = s.url ? s.url : 'section.html?p='+s.id;
    return '<li><a class="row" style="--i:'+i+'" href="#" data-section-url="'+url+'" data-section-title="'+TROF.name(s)+'"><span class="ic">'+s.icon+'</span><span><b>'+TROF.name(s)+'</b><small>'+TROF.desc(s)+'</small></span></a></li>';
  }).join('');
  TROF.mountAccount();
  TROF.renderServerSelector();
  if(!TROF.auth.user)hint.textContent=TROF.t('hint');
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){menu.classList.add('in');io.disconnect()}})},{threshold:.1});
    io.observe(menu);
  }else{menu.classList.add('in')}

  bindSectionButtons();
});

var logo=document.getElementById('logo'),tilt=document.getElementById('tilt');
if(!calm){
  logo.addEventListener('pointermove',function(e){
    var b=logo.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;
    tilt.style.transform='perspective(600px) rotateY('+(x*18)+'deg) rotateX('+(-y*18)+'deg) scale(1.03)';
  });
  logo.addEventListener('pointerleave',function(){tilt.style.transform=''});
  var dust=document.getElementById('dust');
  for(var k=0;k<16;k++){
    var d=document.createElement('i'),s=2+Math.random()*3;
    d.style.cssText='left:'+(Math.random()*100)+'%;width:'+s+'px;height:'+s+'px;animation-duration:'+(9+Math.random()*10)+'s;animation-delay:-'+(Math.random()*15)+'s';
    dust.appendChild(d);
  }
}

function bindSectionButtons(){
  document.querySelectorAll('[data-section-url]').forEach(function(btn){
    btn.onclick = function(e){
      e.preventDefault();
      var url = btn.getAttribute('data-section-url');
      var title = btn.getAttribute('data-section-title');
      loadSection(url, title);
    };
  });
}

/* ============================================
   🚀 تحميل القسم عبر fetch (بدون iframe)
   ============================================ */
async function loadSection(url, title){
  var mainView = document.getElementById('main-view');
  var sectionView = document.getElementById('section-view');
  var titleEl = document.getElementById('section-title');
  var body = document.getElementById('section-body');

  mainView.hidden = true;
  sectionView.hidden = false;
  titleEl.textContent = title;

  // عرض مؤشر تحميل صغير
  body.innerHTML = '<div class="section-loader-inline"><div class="loader-spinner"></div><p>جاري التحميل...</p></div>';

  try {
    // جلب الصفحة
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var html = await res.text();

    // استخراج الـ body فقط
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    // إزالة الهيدر والفوتر والسكربتات المكررة
    var innerHeader = doc.querySelector('header.bar');
    var innerFooter = doc.querySelector('footer.wrap');
    var dust = doc.getElementById('dust');
    if (innerHeader) innerHeader.remove();
    if (innerFooter) innerFooter.remove();
    if (dust) dust.remove();

    // إزالة كل الـ scripts لأن app.js محمّل مسبقاً
    doc.querySelectorAll('script').forEach(function(s){ s.remove(); });

    // استخراج محتوى main
    var mainContent = doc.querySelector('main.page');
    if (mainContent) {
      body.innerHTML = mainContent.innerHTML;
    } else {
      body.innerHTML = doc.body.innerHTML;
    }

    // تشغيل أكواد الصفحة يدوياً بعد الحقن
    await runPageScript(url, body);

  } catch(e) {
    console.error('Load section error:', e);
    body.innerHTML = '<p class="soon">❌ تعذر تحميل القسم. حاول مرة أخرى.</p>';
  }

  window.scrollTo({top: 0, behavior: 'smooth'});
  history.pushState({section: url, title: title}, title, '#' + url);
}

/* ============================================
   ⚙️ تشغيل أكواد الصفحة بعد الحقن
   ============================================ */
async function runPageScript(url, container){
  // جلب السكربت الموجود داخل الصفحة
  try {
    var res = await fetch(url);
    var html = await res.text();
    var parser = new DOMParser();
    var doc = parser.parseFromString(html, 'text/html');

    // البحث عن السكربتات داخل الصفحة (بعد app.js)
    var scripts = doc.querySelectorAll('script');
    var lastScript = null;

    scripts.forEach(function(s){
      // تجاهل سكربت app.js
      if (s.src && s.src.indexOf('app.js') > -1) return;
      // تجاهل سكربت اللغة
      if (s.textContent.indexOf('trof_lang') > -1) return;
      if (s.textContent.trim().length > 50) {
        lastScript = s.textContent;
      }
    });

    if (lastScript) {
      // تنفيذ السكربت داخل الصفحة الحالية
      var scriptEl = document.createElement('script');
      scriptEl.textContent = lastScript;
      document.body.appendChild(scriptEl);
      // إزالة السكربت بعد التنفيذ لتجنب التكرار
      setTimeout(function(){ scriptEl.remove(); }, 100);
    }
  } catch(e) {
    console.warn('runPageScript error:', e);
  }
}

function backToMain(){
  var mainView = document.getElementById('main-view');
  var sectionView = document.getElementById('section-view');
  var body = document.getElementById('section-body');

  sectionView.hidden = true;
  mainView.hidden = false;
  body.innerHTML = '';

  history.pushState({}, document.title, './');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('back-to-main').onclick = backToMain;

window.onpopstate = function(e){
  if(e.state && e.state.section){
    loadSection(e.state.section, e.state.title || '');
  }else{
    backToMain();
  }
};
})();
</script>
</body>
</html>
