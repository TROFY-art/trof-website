<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>try{if(localStorage.getItem('trof_lang')==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr'}}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سياسة الخصوصية | TROF System</title>
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .legal-page { max-width: 800px; margin: 0 auto; padding: 20px 0 60px; }
  .legal-page h1 { font-size: 2rem; margin-bottom: 8px; }
  .legal-page .last-update { color: var(--muted); font-size: .9rem; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .legal-page h2 { font-size: 1.3rem; color: var(--gold-hi); margin-top: 32px; margin-bottom: 12px; }
  .legal-page p, .legal-page li { line-height: 2; color: var(--text); }
  .legal-page ul { padding-inline-start: 24px; }
  .legal-page li { margin-bottom: 8px; }
  .legal-page strong { color: var(--gold-hi); }
  .legal-page code { background: var(--panel); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--gold-hi); font-size: .9rem; }
  .legal-page .info-box { background: #4ade8010; border: 1px solid #4ade8040; border-radius: 12px; padding: 16px 20px; margin: 20px 0; }
  .legal-page .info-box strong { color: #4ade80; }
  .legal-page table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  .legal-page table th, .legal-page table td { padding: 10px 14px; border: 1px solid var(--line); text-align: start; }
  .legal-page table th { background: var(--panel); color: var(--gold-hi); font-weight: 800; }
  .legal-page table td { background: var(--bg); }
</style>
</head>
<body>
<div id="dust" aria-hidden="true"></div>

<header class="wrap bar">
  <div class="hd">
    <a class="brand" href="./" aria-label="TROF System"><img src="logo.webp" alt="" width="36" height="36"></a>
    <button class="lang" id="lang" type="button"></button>
  </div>
  <div class="hd-right">
  <div id="acct"></div>
  <div id="server-selector"></div>
  </div>
</header>

<main class="wrap">
  <a class="back" href="./" style="margin-bottom:20px">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
    <span id="p-back">الرجوع للرئيسية</span>
  </a>

  <div class="legal-page">
    <h1 id="p-title">🔒 سياسة الخصوصية</h1>
    <p class="last-update"><span id="p-last">آخر تحديث</span>: 2026-01-01</p>

    <p id="p-intro"></p>

    <h2 id="p-h1"></h2>
    <p id="p-h1b"></p>
    <table>
      <thead><tr>
        <th id="p-th1">نوع البيانات</th>
        <th id="p-th2">الغرض</th>
        <th id="p-th3">المصدر</th>
      </tr></thead>
      <tbody id="p-tbody"></tbody>
    </table>

    <h2 id="p-h2"></h2><p id="p-h2b"></p><ul id="p-h2l"></ul>
    <h2 id="p-h3"></h2><p id="p-h3b"></p><ul id="p-h3l"></ul>
    <h2 id="p-h4"></h2><p><strong id="p-h4b"></strong></p><p id="p-h4b2"></p><ul id="p-h4l"></ul>
    <h2 id="p-h5"></h2><p id="p-h5b"></p><ul id="p-h5l"></ul><p id="p-h5b2"></p><ul id="p-h5l2"></ul>
    <h2 id="p-h6"></h2><p id="p-h6b"></p><ul id="p-h6l"></ul>
    <h2 id="p-h7"></h2><p id="p-h7b"></p><ul id="p-h7l"></ul><p id="p-h7b2"></p>
    <h2 id="p-h8"></h2><p id="p-h8b"></p><ul id="p-h8l"></ul><p id="p-h8b2"></p>
    <h2 id="p-h9"></h2><p id="p-h9b"></p>
    <h2 id="p-h10"></h2><p id="p-h10b"></p>
    <h2 id="p-h11"></h2><p id="p-h11b"></p>
    <ul>
      <li><span id="p-email"></span> <code>support@trof.dpdns.org</code></li>
      <li><span id="p-discord"></span> TROF System Server</li>
    </ul>

    <div class="info-box">
      <p><strong id="p-promise"></strong> <span id="p-promiseb"></span></p>
    </div>

    <p style="margin-top:40px;text-align:center;color:var(--muted);font-size:.9rem" id="p-copy"></p>
  </div>
</main>

<footer class="wrap">TROF System.</footer>

<script src="app.js"></script>
<script>
TROF.dust();
TROF.load(function(){
  TROF.mountAccount();
  TROF.renderServerSelector();

  var T = TROF.t;
  document.title = T('privacyPageTitle');
  document.getElementById('p-back').textContent = T('privacyBack');
  document.getElementById('p-title').textContent = T('privacyTitle');
  document.getElementById('p-last').textContent = T('privacyLastUpdate');
  document.getElementById('p-intro').textContent = T('privacyIntro');
  document.getElementById('p-h1').textContent = T('privacyH1');
  document.getElementById('p-h1b').textContent = T('privacyH1Body');
  document.getElementById('p-th1').textContent = T('privacyTableType');
  document.getElementById('p-th2').textContent = T('privacyTablePurpose');
  document.getElementById('p-th3').textContent = T('privacyTableSource');
  var rows = ['privacyRow1','privacyRow2','privacyRow3','privacyRow4','privacyRow5','privacyRow6','privacyRow7'];
  document.getElementById('p-tbody').innerHTML = rows.map(function(k){
    var r = T(k);
    return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';
  }).join('');
  document.getElementById('p-h2').textContent = T('privacyH2');
  document.getElementById('p-h2b').textContent = T('privacyH2Body');
  document.getElementById('p-h2l').innerHTML = T('privacyH2List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h3').textContent = T('privacyH3');
  document.getElementById('p-h3b').textContent = T('privacyH3Body');
  document.getElementById('p-h3l').innerHTML = T('privacyH3List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h4').textContent = T('privacyH4');
  document.getElementById('p-h4b').textContent = T('privacyH4Body');
  document.getElementById('p-h4b2').textContent = T('privacyH4Body2');
  document.getElementById('p-h4l').innerHTML = T('privacyH4List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h5').textContent = T('privacyH5');
  document.getElementById('p-h5b').textContent = T('privacyH5Body');
  document.getElementById('p-h5l').innerHTML = T('privacyH5List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h5b2').textContent = T('privacyH5Body2');
  document.getElementById('p-h5l2').innerHTML = T('privacyH5List2').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h6').textContent = T('privacyH6');
  document.getElementById('p-h6b').textContent = T('privacyH6Body');
  document.getElementById('p-h6l').innerHTML = T('privacyH6List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h7').textContent = T('privacyH7');
  document.getElementById('p-h7b').textContent = T('privacyH7Body');
  document.getElementById('p-h7l').innerHTML = T('privacyH7List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h7b2').textContent = T('privacyH7Body2');
  document.getElementById('p-h8').textContent = T('privacyH8');
  document.getElementById('p-h8b').textContent = T('privacyH8Body');
  document.getElementById('p-h8l').innerHTML = T('privacyH8List').map(function(x){return '<li>'+x+'</li>'}).join('');
  document.getElementById('p-h8b2').textContent = T('privacyH8Body2');
  document.getElementById('p-h9').textContent = T('privacyH9');
  document.getElementById('p-h9b').textContent = T('privacyH9Body');
  document.getElementById('p-h10').textContent = T('privacyH10');
  document.getElementById('p-h10b').textContent = T('privacyH10Body');
  document.getElementById('p-h11').textContent = T('privacyH11');
  document.getElementById('p-h11b').textContent = T('privacyH11Body');
  document.getElementById('p-email').textContent = T('termsContactEmail');
  document.getElementById('p-discord').textContent = T('termsContactDiscord');
  document.getElementById('p-promise').textContent = T('privacyPromise');
  document.getElementById('p-promiseb').textContent = T('privacyPromiseBody');
  document.getElementById('p-copy').textContent = T('termsCopyright');
});
</script>
</body>
</html>
