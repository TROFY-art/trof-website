<style>
  .legal-page { max-width: 800px; margin: 0 auto; padding: 20px 0 60px; }
  .legal-page h1 { font-size: 2rem; margin-bottom: 8px; }
  .legal-page .last-update { color: var(--muted); font-size: .9rem; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .legal-page h2 { font-size: 1.3rem; color: var(--gold-hi); margin-top: 32px; margin-bottom: 12px; }
  .legal-page p, .legal-page li { line-height: 2; color: var(--text); }
  .legal-page ul { padding-inline-start: 24px; }
  .legal-page li { margin-bottom: 8px; }
  .legal-page strong { color: var(--gold-hi); }
  .legal-page code { background: var(--panel); padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--gold-hi); font-size: .9rem; }
  .legal-page .info-box { background: #4ade8010; border: 1px solid #4ade8040; border-radius: 12px; padding: 16px 20px; margin: 20px 0; }
  .legal-page .info-box strong { color: #4ade80; }
  .legal-page table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  .legal-page table th, .legal-page table td { padding: 10px 14px; border: 1px solid var(--line); text-align: start; }
  .legal-page table th { background: var(--panel); color: var(--gold-hi); font-weight: 800; }
  .legal-page table td { background: var(--bg); }
</style>
