TROF.load(function(){
  TROF.mountAccount();

    return;

  loadSettings(gid);
  bindEvents(gid);
});

async function loadSettings(gid){
  var api = TROF.CONFIG.apiUrl;
  var token = TROF.token();

  // جلب القنوات
  try{
    var res = await fetch(api + '/guild/' + gid + '/channels', {
      headers: {Authorization: 'Bearer ' + token}
    });
    if(res.ok){
      var data = await res.json();
      var chSel = document.getElementById('w-channel');
      var gbSel = document.getElementById('w-goodbye');
      data.channels.forEach(function(c){
        chSel.innerHTML += '<option value="' + c.id + '">#' + c.name + '</option>';
        gbSel.innerHTML += '<option value="' + c.id + '">#' + c.name + '</option>';
      });
    }
  }catch(e){ console.error('channels error', e) }

  // جلب الرتب
  try{
    var res = await fetch(api + '/guild/' + gid + '/roles', {
      headers: {Authorization: 'Bearer ' + token}
    });
    if(res.ok){
      var data = await res.json();
      var roleSel = document.getElementById('w-role');
      data.roles.forEach(function(r){
        roleSel.innerHTML += '<option value="' + r.id + '">' + r.name + '</option>';
      });
    }
  }catch(e){ console.error('roles error', e) }

  // جلب الإعدادات
  try{
    var res = await fetch(api + '/guild/' + gid + '/welcome', {
      headers: {Authorization: 'Bearer ' + token}
    });
    if(res.ok){
      var data = await res.json();
      if(data.settings){
        var s = data.settings;
        if(s.enabled !== undefined) document.getElementById('w-enabled').checked = s.enabled;
        if(s.mention_member !== undefined) document.getElementById('w-mention').checked = s.mention_member;
        if(s.channel_id) document.getElementById('w-channel').value = s.channel_id;
        if(s.goodbye_channel_id) document.getElementById('w-goodbye').value = s.goodbye_channel_id;
        if(s.auto_role_id) document.getElementById('w-role').value = s.auto_role_id;
        if(s.welcome_message) document.getElementById('w-message').value = s.welcome_message;
        if(s.goodbye_message) document.getElementById('w-goodbye-message').value = s.goodbye_message;
        if(s.text_position) document.getElementById('d-text-pos').value = s.text_position;
        if(s.show_avatar !== undefined) document.getElementById('d-show-avatar').checked = s.show_avatar;
        if(s.avatar_shape) document.getElementById('d-avatar-shape').value = s.avatar_shape;
        if(s.avatar_size) document.getElementById('d-avatar-size').value = s.avatar_size;
        if(s.text_color) document.getElementById('d-text-color').value = s.text_color;
        if(s.text_size) document.getElementById('d-text-size').value = s.text_size;
        if(s.card_width) document.getElementById('d-card-width').value = s.card_width;
        if(s.card_height) document.getElementById('d-card-height').value = s.card_height;
        if(s.bg_blur !== undefined) document.getElementById('d-bg-blur').value = s.bg_blur;
        if(s.bg_brightness) document.getElementById('d-bg-brightness').value = s.bg_brightness;
        if(s.preset) document.querySelector('.preset-btn[data-preset="' + s.preset + '"]').classList.add('active');
        
        updateAllLabels();
      }
    }
  }catch(e){ console.error('settings error', e) }

  // جلب صورة الخلفية
  loadBackground(gid);
  
  // تحديث المعاينة
  updatePreview();
}

function updateAllLabels(){
  ['d-card-width', 'd-card-height', 'd-avatar-size', 'd-text-size', 'd-bg-blur', 'd-bg-brightness'].forEach(function(id){
    var el = document.getElementById(id);
    var lbl = document.getElementById(id + '-val');
    if(el && lbl) lbl.textContent = el.value;
  });
}

function loadBackground(gid){
  var api = TROF.CONFIG.apiUrl;
  var preview = document.getElementById('upload-preview');
  var actions = document.getElementById('upload-actions');

  fetch(api + '/guild/' + gid + '/welcome/bg')
    .then(function(r){
      if(r.ok){
        var imgUrl = api + '/guild/' + gid + '/welcome/bg?t=' + Date.now();
        preview.innerHTML = '<img src="' + imgUrl + '" alt="خلفية" crossorigin="anonymous">';
        actions.hidden = false;
        var bg = document.getElementById('preview-bg');
        bg.style.backgroundImage = 'url(' + imgUrl + ')';
      }else{
        preview.innerHTML = '<div class="upload-placeholder"><span>📁</span><p>اضغط لاختيار صورة</p><small>PNG, JPG, WEBP (5MB)</small></div>';
        actions.hidden = true;
      }
    })
    .catch(function(){});
}

function updatePreview(){
  var preview = document.getElementById('welcome-preview');
  var content = document.getElementById('preview-content');
  var text = document.getElementById('preview-text');
  var avatar = document.getElementById('preview-avatar');
  var bg = document.getElementById('preview-bg');
  var overlay = document.getElementById('preview-overlay');
  
  var w = parseInt(document.getElementById('d-card-width').value);
  var h = parseInt(document.getElementById('d-card-height').value);
  var showAv = document.getElementById('d-show-avatar').checked;
  var shape = document.getElementById('d-avatar-shape').value;
  var avSize = parseInt(document.getElementById('d-avatar-size').value);
  var color = document.getElementById('d-text-color').value;
  var size = parseInt(document.getElementById('d-text-size').value);
  var pos = document.getElementById('d-text-pos').value;
  var blur = parseInt(document.getElementById('d-bg-blur').value);
  var brightness = parseInt(document.getElementById('d-bg-brightness').value);
  
  // حجم البطاقة (نسبة العرض إلى 300px للعرض في الموقع)
  var aspect = w / h;
  var displayWidth = Math.min(w, 600);
  var displayHeight = displayWidth / aspect;
  
  preview.style.width = displayWidth + 'px';
  preview.style.height = displayHeight + 'px';
  
  // تأثيرات الخلفية
  bg.style.filter = 'blur(' + (blur/10) + 'px) brightness(' + (brightness/100) + ')';
  bg.style.backgroundSize = 'cover';
  bg.style.backgroundPosition = 'center';
  
  // ترتيب المحتوى
  var scale = displayWidth / w;
  content.style.padding = (h * 0.05 * scale) + 'px';
  content.style.gap = (h * 0.03 * scale) + 'px';
  
  if(pos === 'top'){
    content.style.justifyContent = 'flex-start';
  }else if(pos === 'bottom'){
    content.style.justifyContent = 'flex-end';
  }else{
    content.style.justifyContent = 'center';
  }
  
  // صورة العضو
  avatar.style.display = showAv ? 'flex' : 'none';
  avatar.style.width = (avSize * scale) + 'px';
  avatar.style.height = (avSize * scale) + 'px';
  avatar.style.fontSize = (avSize * 0.4 * scale) + 'px';
  
  if(shape === 'circle'){
    avatar.style.borderRadius = '50%';
  }else if(shape === 'square'){
    avatar.style.borderRadius = '0';
  }else{
    avatar.style.borderRadius = (avSize * 0.15 * scale) + 'px';
  }
  
  // النص
  text.style.color = color;
  text.style.fontSize = (size * scale) + 'px';
  text.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)';
  
  // محتوى النص
  var msg = document.getElementById('w-message').value || 'مرحباً {user} في {server}!';
  var mention = document.getElementById('w-mention').checked;
  var displayMsg = msg
    .replace('{user}', mention ? '@Ali' : 'Ali')
    .replace('{server}', 'TROF System')
    .replace('{count}', '68');
  text.textContent = displayMsg;
}

function applyPreset(preset){
  var presets = {
    'default': { color: '#FFFFFF', size: 60, avatar: true, shape: 'circle', avSize: 150, textColor: '#FFFFFF', textSize: 60, blur: 0, brightness: 70 },
    'dark': { color: '#FFFFFF', size: 55, avatar: true, shape: 'circle', avSize: 140, textColor: '#FFFFFF', textSize: 55, blur: 8, brightness: 40 },
    'light': { color: '#000000', size: 65, avatar: true, shape: 'circle', avSize: 160, textColor: '#1a1a1a', textSize: 65, blur: 0, brightness: 95 },
    'gold': { color: '#FFD700', size: 70, avatar: true, shape: 'rounded', avSize: 170, textColor: '#FFD700', textSize: 70, blur: 3, brightness: 60 },
    'blue': { color: '#00BFFF', size: 60, avatar: true, shape: 'circle', avSize: 150, textColor: '#87CEEB', textSize: 60, blur: 5, brightness: 50 }
  };
  
  var p = presets[preset] || presets['default'];
  document.getElementById('d-text-color').value = p.textColor;
  document.getElementById('d-text-size').value = p.textSize;
  document.getElementById('d-show-avatar').checked = p.avatar;
  document.getElementById('d-avatar-shape').value = p.shape;
  document.getElementById('d-avatar-size').value = p.avSize;
  document.getElementById('d-bg-blur').value = p.blur;
  document.getElementById('d-bg-brightness').value = p.brightness;
  
  updateAllLabels();
  updatePreview();
}

function bindEvents(gid){
  // ===== رفع الصورة =====
  var bgInput = document.getElementById('w-bg-input');
  var uploadArea = document.getElementById('upload-area');
  var uploadPreview = document.getElementById('upload-preview');
  var uploadActions = document.getElementById('upload-actions');
  var bgRemove = document.getElementById('w-bg-remove');
  var bgMsg = document.getElementById('bg-msg');

  uploadArea.onclick = function(){ bgInput.click(); };

  bgInput.onchange = async function(){
    var file = bgInput.files[0];
    if(!file) return;
    if(file.size > 5 * 1024 * 1024){
      bgMsg.textContent = '❌ حجم الصورة كبير (الحد 5MB)';
      bgMsg.style.color = '#f87171';
      return;
    }

    var reader = new FileReader();
    reader.onload = function(e){
      uploadPreview.innerHTML = '<img src="' + e.target.result + '" alt="معاينة">';
      document.getElementById('preview-bg').style.backgroundImage = 'url(' + e.target.result + ')';
    };
    reader.readAsDataURL(file);

    bgMsg.textContent = '⏳ جاري الرفع...';
    bgMsg.style.color = '#f2c23c';

    var formData = new FormData();
    formData.append('file', file);

    try{
      var res = await fetch(TROF.CONFIG.apiUrl + '/guild/' + gid + '/welcome/upload-bg', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + TROF.token()},
        body: formData
      });
      var data = await res.json();
      if(res.ok){
        bgMsg.textContent = '✅ تم رفع الصورة بنجاح!';
        bgMsg.style.color = '#4ade80';
        uploadActions.hidden = false;
      }else{
        bgMsg.textContent = '❌ ' + (data.detail || 'فشل الرفع');
        bgMsg.style.color = '#f87171';
      }
    }catch(e){
      bgMsg.textContent = '❌ خطأ في الاتصال';
      bgMsg.style.color = '#f87171';
    }
  };

  bgRemove.onclick = async function(){
    if(!confirm('حذف الصورة؟')) return;
    bgMsg.textContent = '⏳ جاري الحذف...';
    try{
      var res = await fetch(TROF.CONFIG.apiUrl + '/guild/' + gid + '/welcome/bg', {
        method: 'DELETE',
        headers: {'Authorization': 'Bearer ' + TROF.token()}
      });
      if(res.ok){
        uploadPreview.innerHTML = '<div class="upload-placeholder"><span>📁</span><p>اضغط لاختيار صورة</p><small>PNG, JPG, WEBP (5MB)</small></div>';
        uploadActions.hidden = true;
        document.getElementById('preview-bg').style.backgroundImage = '';
        bgMsg.textContent = '✅ تم حذف الصورة';
        bgMsg.style.color = '#4ade80';
      }
    }catch(e){}
  };

  // ===== الأنماط الجاهزة =====
  document.querySelectorAll('.preset-btn').forEach(function(btn){
    btn.onclick = function(){
      document.querySelectorAll('.preset-btn').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      applyPreset(btn.getAttribute('data-preset'));
    };
  });

  // ===== منزلقات التصميم =====
  var sliders = ['d-card-width', 'd-card-height', 'd-avatar-size', 'd-text-size', 'd-bg-blur', 'd-bg-brightness'];
  sliders.forEach(function(id){
    var el = document.getElementById(id);
    if(el){
      el.addEventListener('input', function(){
        var lbl = document.getElementById(id + '-val');
        if(lbl) lbl.textContent = el.value;
        updatePreview();
      });
    }
  });

  // ===== قوائم التصميم =====
  ['d-text-pos', 'd-avatar-shape', 'd-show-avatar', 'd-text-color', 'w-message', 'w-mention'].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.addEventListener('input', updatePreview);
  });

  // ===== حفظ الإعدادات =====
  document.getElementById('w-save').onclick = async function(){
    var msg = document.getElementById('w-msg');
    var btn = this;
    btn.disabled = true;
    msg.textContent = '⏳ جاري الحفظ...';

    var payload = {
      enabled: document.getElementById('w-enabled').checked,
      mention_member: document.getElementById('w-mention').checked,
      channel_id: document.getElementById('w-channel').value || null,
      goodbye_channel_id: document.getElementById('w-goodbye').value || null,
      auto_role_id: document.getElementById('w-role').value || null,
      welcome_message: document.getElementById('w-message').value || null,
      goodbye_message: document.getElementById('w-goodbye-message').value || null,
      text_position: document.getElementById('d-text-pos').value,
      show_avatar: document.getElementById('d-show-avatar').checked,
      avatar_shape: document.getElementById('d-avatar-shape').value,
      avatar_size: parseInt(document.getElementById('d-avatar-size').value),
      text_color: document.getElementById('d-text-color').value,
      text_size: parseInt(document.getElementById('d-text-size').value),
      card_width: parseInt(document.getElementById('d-card-width').value),
      card_height: parseInt(document.getElementById('d-card-height').value),
      bg_blur: parseInt(document.getElementById('d-bg-blur').value),
      bg_brightness: parseInt(document.getElementById('d-bg-brightness').value),
      preset: document.querySelector('.preset-btn.active') ? document.querySelector('.preset-btn.active').getAttribute('data-preset') : 'default'
    };

    try{
      var res = await fetch(TROF.CONFIG.apiUrl + '/guild/' + gid + '/welcome', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + TROF.token(),
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });
      if(res.ok){
        msg.textContent = '✅ تم الحفظ بنجاح!';
        msg.style.color = '#4ade80';
      }else{
        msg.textContent = '❌ فشل الحفظ';
        msg.style.color = '#f87171';
      }
    }catch(e){
      msg.textContent = '❌ خطأ في الاتصال';
      msg.style.color = '#f87171';
    }
    btn.disabled = false;
    setTimeout(function(){ msg.textContent = ''; }, 3000);
  };
}
})();
</script>
</body>
</html>
